<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>臂丛神经联动可视化 | Brachial Plexus Atlas</title>
<style>
  :root {
    --bg: #f5f7fb;
    --surface: #ffffff;
    --surface-2: #eef2f8;
    --border: #dce3ee;
    --text: #132033;
    --muted: #5a6a82;
    --accent: #2563eb;
    --accent-soft: #e0ecff;
    --root-color: #2563eb;
    --trunk-color: #0891b2;
    --ant-color: #059669;
    --post-color: #d97706;
    --cord-color: #7c3aed;
    --branch-color: #e11d48;
    --collateral-color: #64748b;
    --lesion-color: #dc2626;
    --skin-base: #eef2f7;
    --skin-stroke: #94a3b8;
    --muscle-base: #e2e8f0;
    --muscle-active: #2563eb;
    --sensory-active: #0891b2;
    --shadow: 0 8px 28px rgba(15, 23, 42, 0.06);
  }

  [data-theme="dark"] {
    --bg: #0b1120;
    --surface: #131c2e;
    --surface-2: #1b2740;
    --border: #263554;
    --text: #e8eef8;
    --muted: #94a5bf;
    --accent: #60a5fa;
    --accent-soft: #1a2c4e;
    --root-color: #60a5fa;
    --trunk-color: #22d3ee;
    --ant-color: #34d399;
    --post-color: #fbbf24;
    --cord-color: #a78bfa;
    --branch-color: #fb7185;
    --collateral-color: #94a3b8;
    --lesion-color: #f87171;
    --skin-base: #1e293b;
    --skin-stroke: #475569;
    --muscle-base: #25334a;
    --muscle-active: #60a5fa;
    --sensory-active: #22d3ee;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans", "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    transition: background 0.25s, color 0.25s;
  }

  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 22px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 20;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand-badge {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: linear-gradient(135deg, #2563eb, #0891b2);
    display: grid;
    place-items: center;
    color: #fff;
    font-weight: 700;
    font-size: 14px;
  }

  .brand h1 { font-size: 16.5px; font-weight: 700; line-height: 1.25; }
  .brand p { font-size: 12px; color: var(--muted); }

  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; }

  .btn {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    padding: 6px 11px;
    border-radius: 8px;
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.16s;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }

  .btn:hover { border-color: var(--accent); background: var(--surface-2); }
  .btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .main-grid {
    flex: 1;
    display: grid;
    grid-template-columns: minmax(0, 1.45fr) 460px;
    align-items: start;
    gap: 16px;
    padding: 16px 22px 24px;
    max-width: 1680px;
    width: 100%;
    margin: 0 auto;
  }

  @media (max-width: 1240px) {
    .main-grid { grid-template-columns: 1fr; }
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .subbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--surface-2);
  }

  .lesion-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .lesion-label { font-size: 12px; font-weight: 600; color: var(--muted); }

  .pill {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.16s;
  }

  .pill:hover { border-color: var(--lesion-color); color: var(--lesion-color); }
  .pill.active { background: var(--lesion-color); border-color: var(--lesion-color); color: #fff; }

  .legend { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-size: 11.5px; color: var(--muted); }
  .legend-item { display: inline-flex; align-items: center; gap: 5px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

  .svg-wrap {
    position: relative;
    flex: 1;
    overflow-x: auto;
    display: flex;
    align-items: center;
    padding: 10px;
  }

  svg#plexus {
    width: 100%;
    min-width: 820px;
    margin: 0 auto;
    height: auto;
    max-height: 660px;
    user-select: none;
  }

  .is-hidden { display: none !important; }

  /* 3D 空间示意视图：画布固定为深色舞台，不随主题变化 */
  .viewport3d {
    position: relative;
    height: clamp(520px, 66vh, 700px);
    overflow: hidden;
    background: radial-gradient(circle at 48% 46%, #13203a 0%, #090f1d 68%, #050811 100%);
    cursor: grab;
    touch-action: none;
  }
  .viewport3d:active { cursor: grabbing; }
  canvas#scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  .hud-top {
    position: absolute; top: 10px; left: 12px; right: 12px;
    display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 8px;
    pointer-events: none;
  }
  .hud-group {
    display: flex; flex-wrap: wrap; align-items: center; gap: 5px;
    pointer-events: auto;
    background: rgba(16, 25, 43, 0.78); border: 1px solid #243454; padding: 5px 8px; border-radius: 10px;
  }
  .hud-label { font-size: 11px; color: #8ea1be; font-weight: 600; }
  .hud-pill {
    border: 1px solid #243454; background: rgba(23, 35, 59, 0.9); color: #e9f0fb;
    padding: 3px 9px; border-radius: 999px; font-size: 11.5px; cursor: pointer; transition: all 0.15s;
  }
  .hud-pill:hover { border-color: #38bdf8; }
  .hud-pill.active { background: #38bdf8; border-color: #38bdf8; color: #05101d; font-weight: 600; }
  .hud-bottom {
    position: absolute; bottom: 10px; left: 12px; max-width: calc(100% - 24px);
    pointer-events: none;
    font-size: 11.5px; line-height: 1.5; color: #8ea1be;
    background: rgba(16, 25, 43, 0.78); border: 1px solid #243454; padding: 6px 12px; border-radius: 10px;
  }

  .stage-header { font-size: 13px; font-weight: 700; fill: var(--muted); }
  .stage-sub { font-size: 10.5px; fill: var(--muted); opacity: 0.78; }
  .stage-divider { stroke: var(--border); stroke-width: 1; stroke-dasharray: 4 5; }

  .edge {
    fill: none;
    stroke-width: 3.1;
    stroke-linecap: round;
    transition: opacity 0.2s, stroke-width 0.2s, stroke 0.2s;
    opacity: 0.7;
  }

  .edge.posterior { stroke-dasharray: 7 4; }
  .edge.collateral-edge { stroke-width: 2.1; stroke-dasharray: 3 3; opacity: 0.58; }
  .edge.dim { opacity: 0.1; }
  .edge.highlight { opacity: 1; stroke-width: 4.8; filter: drop-shadow(0 0 5px rgba(37, 99, 235, 0.35)); }
  .edge.lesion-downstream { stroke: var(--lesion-color) !important; opacity: 1; stroke-width: 4.4; }

  .pulse-edge {
    fill: none;
    stroke: #ffffff;
    stroke-width: 1.9;
    stroke-linecap: round;
    stroke-dasharray: 6 24;
    pointer-events: none;
    opacity: 0;
  }

  .pulse-on .pulse-edge.active-pulse {
    opacity: 0.9;
    animation: flowPulse 1.1s linear infinite;
  }

  @keyframes flowPulse {
    from { stroke-dashoffset: 30; }
    to { stroke-dashoffset: 0; }
  }

  .node-group { cursor: pointer; transition: opacity 0.2s; }
  .node-group.dim { opacity: 0.2; }
  .node-rect { rx: 10; ry: 10; fill: var(--surface); stroke-width: 2; transition: all 0.18s; }
  .node-group:hover .node-rect { stroke-width: 3; filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.12)); }
  .node-group.selected .node-rect { stroke-width: 3.2; filter: drop-shadow(0 0 10px rgba(37, 99, 235, 0.38)); }
  .node-group.lesion-site .node-rect { stroke: var(--lesion-color) !important; fill: rgba(220, 38, 38, 0.13); stroke-width: 3.2; }

  .node-label { font-size: 12px; font-weight: 600; fill: var(--text); pointer-events: none; }
  .node-sub { font-size: 9.8px; fill: var(--muted); pointer-events: none; }
  .collateral-rect + text + .node-sub { font-size: 9.4px; }
  .collateral-rect { rx: 7; ry: 7; fill: var(--surface-2); stroke: var(--collateral-color); stroke-width: 1.4; }
  .collateral-label { font-size: 10.3px; font-weight: 500; fill: var(--text); pointer-events: none; }

  .hint-footer {
    font-size: 11.5px;
    color: var(--muted);
    padding: 10px 14px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  /* Right Column: Limb Atlas + Inspector */
  .side-col {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .limb-card {
    padding: 14px;
    gap: 10px;
  }

  .limb-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
  }

  .limb-title {
    font-size: 14px;
    font-weight: 700;
  }

  .seg-group {
    display: inline-flex;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 2px;
    gap: 2px;
  }

  .seg-btn {
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 11.5px;
    font-weight: 600;
    padding: 4px 9px;
    border-radius: 7px;
    cursor: pointer;
    transition: all 0.16s;
  }

  .seg-btn.active {
    background: var(--surface);
    color: var(--accent);
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
  }

  .limb-svg-box {
    background: var(--surface-2);
    border-radius: 12px;
    padding: 8px 6px 4px;
    position: relative;
  }

  svg#limbSvg {
    width: 100%;
    max-width: 540px;
    margin: 0 auto;
    height: auto;
    display: block;
    user-select: none;
  }

  .limb-outline {
    fill: var(--skin-base);
    stroke: var(--skin-stroke);
    stroke-width: 1.4;
  }

  .limb-view-title {
    font-size: 11px;
    font-weight: 700;
    fill: var(--muted);
  }

  .zone-shape {
    cursor: pointer;
    fill: var(--muscle-base);
    stroke: var(--skin-stroke);
    stroke-width: 0.8;
    fill-opacity: 0.78;
    transition: fill 0.18s, fill-opacity 0.18s, stroke 0.18s, stroke-width 0.18s;
  }

  .zone-shape:hover {
    fill-opacity: 0.95;
    stroke: var(--accent);
    stroke-width: 1.8;
  }

  .zone-shape.active-motor {
    fill: var(--muscle-active);
    fill-opacity: 0.72;
    stroke: var(--muscle-active);
    stroke-width: 1.8;
  }

  .zone-shape.active-sensory {
    fill: var(--sensory-active);
    fill-opacity: 0.65;
    stroke: var(--sensory-active);
    stroke-width: 1.8;
  }

  .zone-shape.active-lesion {
    fill: var(--lesion-color);
    fill-opacity: 0.72;
    stroke: var(--lesion-color);
    stroke-width: 2;
  }

  .zone-shape.active-lesion-partial {
    fill: var(--lesion-color);
    fill-opacity: 0.26;
    stroke: var(--lesion-color);
    stroke-width: 1.6;
    stroke-dasharray: 4 3;
  }


  .limb-status {
    font-size: 12px;
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
  }

  .chip-list {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: 2px;
  }

  .mini-chip {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 600;
    cursor: pointer;
    border: 1px solid transparent;
  }

  .mini-chip:hover { border-color: var(--accent); }
  .mini-chip.lesion { background: rgba(220, 38, 38, 0.14); color: var(--lesion-color); }

  /* Inspector Card */
  .inspector {
    padding: 16px;
    gap: 10px;
  }

  .tag-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 6px;
    background: var(--accent-soft);
    color: var(--accent);
  }
  .tag.lesion { background: rgba(220, 38, 38, 0.14); color: var(--lesion-color); }

  .inspector h2 { font-size: 18px; font-weight: 700; line-height: 1.3; margin-top: 2px; }
  .inspector .en-name { font-size: 12px; color: var(--muted); }

  .info-block {
    background: var(--surface-2);
    border-radius: 10px;
    padding: 9px 11px;
  }

  .info-block h3 {
    font-size: 11px;
    letter-spacing: 0.4px;
    color: var(--muted);
    margin-bottom: 4px;
  }

  .info-block p { font-size: 12.6px; line-height: 1.52; color: var(--text); }

  .quiz-box {
    border: 1.5px dashed var(--accent);
    background: var(--accent-soft);
    border-radius: 12px;
    padding: 11px;
    display: none;
    flex-direction: column;
    gap: 7px;
  }

  .quiz-box.show { display: flex; }
  .quiz-q { font-size: 13px; font-weight: 600; line-height: 1.48; }
  .quiz-meta { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); }
  .quiz-feedback { font-size: 12px; font-weight: 600; }
  .quiz-feedback.ok { color: #059669; }
  .quiz-feedback.err { color: #dc2626; }

  /* 损伤部位（平面）选择条 */
  .level-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; flex-basis: 100%; }
  .level-bar .seg-btn.active { color: var(--lesion-color); }
  .level-hint { font-size: 11px; color: var(--muted); }

  /* 上肢图 */
  .limb-fill { fill: var(--surface); }
  .limb-contour { fill: none; stroke: var(--skin-stroke); stroke-width: 1.3; stroke-linejoin: round; pointer-events: none; }
  .limb-mark { fill: none; stroke: var(--skin-stroke); stroke-width: 1; stroke-dasharray: 3 2.5; opacity: 0.85; pointer-events: none; }
  .zone-label {
    font-size: 10.5px; font-weight: 600; fill: var(--text); pointer-events: none;
    paint-order: stroke; stroke: var(--surface-2); stroke-width: 2.6px; stroke-linejoin: round;
  }
  .zone-label.big { font-size: 12.5px; font-weight: 800; }
  .zone-label.on { fill: var(--accent); font-weight: 800; }
  .zone-label.on.lesion { fill: var(--lesion-color); }
  .zone-leader { stroke: var(--muted); stroke-width: 0.7; opacity: 0.75; pointer-events: none; }
  .zone-leader-dot { fill: var(--muted); pointer-events: none; }
  .zone-leader.on { stroke: var(--accent); stroke-width: 1.1; opacity: 1; }
  .zone-leader-dot.on { fill: var(--accent); }
  .zone-leader.on.lesion { stroke: var(--lesion-color); }
  .zone-leader-dot.on.lesion { fill: var(--lesion-color); }
  /* 皮节：未选中时也用淡色区分五条带 */
  .zone-shape[data-zone="d_c5"]:not([class*="active"]):not(.picked) { fill: #f59e0b; fill-opacity: 0.22; }
  .zone-shape[data-zone="d_c6"]:not([class*="active"]):not(.picked) { fill: #10b981; fill-opacity: 0.22; }
  .zone-shape[data-zone="d_c7"]:not([class*="active"]):not(.picked) { fill: #3b82f6; fill-opacity: 0.24; }
  .zone-shape[data-zone="d_c8"]:not([class*="active"]):not(.picked) { fill: #8b5cf6; fill-opacity: 0.22; }
  .zone-shape[data-zone="d_t1"]:not([class*="active"]):not(.picked) { fill: #ec4899; fill-opacity: 0.2; }
  .zone-shape.picked { fill: var(--accent); fill-opacity: 0.5; stroke: var(--accent); stroke-width: 2; }

  .kbd-hint { flex-basis: 100%; }
  kbd {
    font-family: inherit; font-size: 0.92em; padding: 0 5px; border-radius: 4px;
    border: 1px solid var(--border); background: var(--surface-2);
  }

  /* ---------- 投影模式：放大字号，图撑满窗口高度 ---------- */
  @media screen {
    body.present .brand p, body.present .hint-footer, body.present .legend { display: none; }
    body.present .brand h1 { font-size: 19px; }
    body.present .btn, body.present .pill { font-size: 14.5px; padding: 7px 13px; }
    body.present .seg-btn { font-size: 14px; padding: 6px 12px; }
    body.present .lesion-label { font-size: 14.5px; }
    body.present .node-label { font-size: 14.5px; }
    body.present .node-sub { font-size: 11.5px; }
    body.present .collateral-label { font-size: 12px; }
    body.present .stage-header { font-size: 15.5px; }
    body.present .stage-sub { font-size: 12.5px; }
    body.present .limb-title { font-size: 16.5px; }
    body.present .limb-status { font-size: 14.5px; }
    body.present .mini-chip { font-size: 13.5px; padding: 3px 10px; }
    body.present .zone-label { font-size: 11.5px; }
    body.present .zone-label.big { font-size: 13.5px; }
    body.present .tag { font-size: 13.5px; }
    body.present .inspector h2 { font-size: 23px; }
    body.present .inspector .en-name { font-size: 14.5px; }
    body.present .info-block h3 { font-size: 13.5px; }
    body.present .info-block p { font-size: 16px; }
    body.present .quiz-q { font-size: 16.5px; }
    body.present .quiz-meta, body.present .quiz-feedback { font-size: 14.5px; }
    body.present .hud-pill, body.present .hud-bottom { font-size: 13.5px; }
  }
  @media screen and (min-width: 1241px) {
    body.present { height: 100vh; overflow: hidden; }
    body.present .main-grid {
      min-height: 0; max-width: none; padding: 10px 14px 12px; align-items: stretch;
      grid-template-columns: minmax(0, 1.5fr) minmax(460px, 0.85fr);
    }
    body.present .main-grid > .card { min-height: 0; }
    body.present .side-col { min-height: 0; overflow-y: auto; }
    body.present .side-col > .card { flex-shrink: 0; }
    body.present .svg-wrap { min-height: 0; overflow: hidden; padding: 6px; }
    body.present svg#plexus { min-width: 0; max-height: none; width: 100%; height: 100%; }
    body.present .viewport3d { height: auto; flex: 1; min-height: 0; }
  }

  /* ---------- 打印讲义：浅色、单栏通路图 + 上肢图与说明并排 ---------- */
  @media print {
    @page { margin: 12mm; }
    :root, [data-theme="dark"] {
      --bg: #ffffff; --surface: #ffffff; --surface-2: #f3f5f9; --border: #cfd6e2; --text: #111827; --muted: #4b5563;
      --accent: #1d4ed8; --accent-soft: #e0ecff;
      --root-color: #2563eb; --trunk-color: #0891b2; --ant-color: #059669; --post-color: #d97706;
      --cord-color: #7c3aed; --branch-color: #e11d48; --collateral-color: #64748b; --lesion-color: #dc2626;
      --skin-base: #eef2f7; --skin-stroke: #94a3b8; --muscle-base: #e2e8f0; --muscle-active: #2563eb; --sensory-active: #0891b2;
      --shadow: none;
    }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body, body.present { display: block; min-height: 0; height: auto; overflow: visible; background: #fff; }
    header { position: static; padding: 0 0 8px; border-bottom: 1px solid var(--border); }
    .toolbar, #viewTabs, .legend, .hint-footer, .viewport3d, .quiz-box, #limbModeTabs, .level-hint, .pulse-edge,
    .pill:not(.active), #levelBar .seg-btn:not(.active), body:not(.has-lesion) .lesion-bar { display: none !important; }
    .main-grid { display: block; padding: 10px 0 0; max-width: none; }
    .card { box-shadow: none; break-inside: avoid; margin-bottom: 10px; }
    .subbar { background: none; }
    .svg-wrap, .svg-wrap.is-hidden { display: flex !important; min-height: 0; overflow: visible; padding: 4px; }
    svg#plexus { min-width: 0; max-height: none; }
    .side-col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: start; }
    .mini-chip { border-color: var(--border); }
  }
</style>
</head>
<body>
  <header>
    <div class="brand">

<script>
// ===== PLEXUS-MODEL:BEGIN =====
// 纤维路由模型：节段、溯源高亮、损伤受累范围都由这里推导，页面其他地方不再手写这些关系。
// 这是唯一的数据源；修改后运行 `node tests/check-model.js` 校验。
const PlexusModel = (() => {
  const ROOTS = ['c5', 'c6', 'c7', 'c8', 't1'];

  // 拓扑：谁发出谁。一条边存在，不代表每条根的纤维都走这条边。
  const LINKS = [
    ['c5', 'upper_trunk'], ['c6', 'upper_trunk'], ['c7', 'middle_trunk'], ['c8', 'lower_trunk'], ['t1', 'lower_trunk'],
    ['upper_trunk', 'up_ant'], ['upper_trunk', 'up_post'], ['middle_trunk', 'mid_ant'], ['middle_trunk', 'mid_post'],
    ['lower_trunk', 'low_post'], ['lower_trunk', 'low_ant'],
    ['up_ant', 'lat_cord'], ['mid_ant', 'lat_cord'], ['up_post', 'post_cord'], ['mid_post', 'post_cord'],
    ['low_post', 'post_cord'], ['low_ant', 'med_cord'],
    ['lat_cord', 'musculocutaneous'], ['lat_cord', 'median'], ['post_cord', 'axillary'], ['post_cord', 'radial'],
    ['med_cord', 'median'], ['med_cord', 'ulnar'],
    ['c5', 'dorsal_scapular'], ['c5', 'long_thoracic'], ['c6', 'long_thoracic'], ['c7', 'long_thoracic'],
    ['upper_trunk', 'suprascapular'], ['upper_trunk', 'subclavius_n'],
    ['lat_cord', 'lat_pectoral'],
    ['post_cord', 'upper_subscapular'], ['post_cord', 'thoracodorsal'], ['post_cord', 'lower_subscapular'],
    ['med_cord', 'med_pectoral'], ['med_cord', 'med_cut_arm'], ['med_cord', 'med_cut_forearm'],
  ];

  // 各神经实际含有的节段（纤维成分）。未列出的中间结构（干/股/束）= 所有能到达它的根。
  const COMPOSITION = {
    musculocutaneous: ['c5', 'c6', 'c7'],
    axillary: ['c5', 'c6'],
    radial: ['c5', 'c6', 'c7', 'c8', 't1'],
    median: ['c6', 'c7', 'c8', 't1'],
    ulnar: ['c8', 't1'],
    dorsal_scapular: ['c5'],
    long_thoracic: ['c5', 'c6', 'c7'],
    suprascapular: ['c5', 'c6'],
    subclavius_n: ['c5', 'c6'],
    lat_pectoral: ['c5', 'c6', 'c7'],
    upper_subscapular: ['c5', 'c6'],
    thoracodorsal: ['c6', 'c7', 'c8'],
    lower_subscapular: ['c5', 'c6'],
    med_pectoral: ['c8', 't1'],
    med_cut_arm: ['c8', 't1'],
    med_cut_forearm: ['c8', 't1'],
  };

  // 支配靶区（id 与页面里的图形区域一一对应）。
  // F(神经, 主要节段, 分出平面 lv, 所经分支 via)
  // lv：0 腋窝/起始处 · 1 上臂 · 2 肘/前臂近端 · 2.8 前臂远端（腕的近侧）· 3 腕 · 4 手
  // via：该纤维走的是神经的哪条具名分支（pin 骨间后神经 · srn 桡神经浅支 · ain 骨间前神经）
  const F = (nerve, roots, lv = 0, via) => ({ nerve, roots: roots.split(' '), lv, via });
  const TARGETS = [
    { id: 'm_deltoid', kind: 'motor', name: '三角肌', fibers: [F('axillary', 'c5 c6')] },
    { id: 'm_subclavius', kind: 'motor', name: '锁骨下肌', fibers: [F('subclavius_n', 'c5 c6')] },
    { id: 'm_pec', kind: 'motor', name: '胸大肌/胸小肌', fibers: [F('lat_pectoral', 'c5 c6 c7'), F('med_pectoral', 'c8 t1')] },
    { id: 'm_serratus', kind: 'motor', name: '前锯肌', fibers: [F('long_thoracic', 'c5 c6 c7')] },
    { id: 'm_biceps', kind: 'motor', name: '肱二头肌/肱肌', fibers: [F('musculocutaneous', 'c5 c6', 1)] },
    { id: 'm_pronator', kind: 'motor', name: '旋前圆肌', fibers: [F('median', 'c6 c7', 2)] },
    { id: 'm_flexor_med', kind: 'motor', name: '桡侧腕屈肌/指浅屈肌', fibers: [F('median', 'c7 c8 t1', 2)] },
    { id: 'm_ain', kind: 'motor', name: '拇长屈肌/示指深屈肌', fibers: [F('median', 'c8 t1', 2, 'ain')] },
    { id: 'm_flexor_uln', kind: 'motor', name: '尺侧腕屈肌/环小指深屈肌', fibers: [F('ulnar', 'c8 t1', 2)] },
    { id: 'm_thenar', kind: 'motor', name: '大鱼际肌', fibers: [F('median', 'c8 t1', 4)] },
    { id: 'm_lumb_lat', kind: 'motor', name: '第1–2蚓状肌', fibers: [F('median', 'c8 t1', 4)] },
    { id: 'm_adductor', kind: 'motor', name: '拇收肌', fibers: [F('ulnar', 'c8 t1', 4)] },
    { id: 'm_hypothenar', kind: 'motor', name: '小鱼际肌', fibers: [F('ulnar', 'c8 t1', 4)] },
    { id: 'm_lumb_med', kind: 'motor', name: '第3–4蚓状肌', fibers: [F('ulnar', 'c8 t1', 4)] },
    { id: 'm_interossei', kind: 'motor', name: '骨间肌', fibers: [F('ulnar', 'c8 t1', 4)] },
    { id: 'm_rotator', kind: 'motor', name: '冈上/冈下肌', fibers: [F('suprascapular', 'c5 c6')] },
    { id: 'm_rhomboid', kind: 'motor', name: '菱形肌', fibers: [F('dorsal_scapular', 'c5')] },
    { id: 'm_teres_major', kind: 'motor', name: '大圆肌/肩胛下肌', fibers: [F('lower_subscapular', 'c5 c6'), F('upper_subscapular', 'c5 c6')] },
    { id: 'm_latissimus', kind: 'motor', name: '背阔肌', fibers: [F('thoracodorsal', 'c6 c7 c8')] },
    { id: 'm_triceps', kind: 'motor', name: '肱三头肌', fibers: [F('radial', 'c7 c8', 0)] },
    { id: 'm_brachiorad', kind: 'motor', name: '肱桡肌/桡侧腕长伸肌', fibers: [F('radial', 'c5 c6', 2)] },
    { id: 'm_ext_digits', kind: 'motor', name: '指伸肌/拇伸肌/尺侧腕伸肌', fibers: [F('radial', 'c7 c8', 2, 'pin')] },

    { id: 's_axil', kind: 'cutaneous', name: '肩外侧(腋神经)', fibers: [F('axillary', 'c5 c6')] },
    { id: 's_med_arm', kind: 'cutaneous', name: '臂内侧(臂内侧皮神经)', fibers: [F('med_cut_arm', 'c8 t1')] },
    { id: 's_med_forearm', kind: 'cutaneous', name: '前臂内侧(前臂内侧皮神经)', fibers: [F('med_cut_forearm', 'c8 t1')] },
    { id: 's_lat_forearm', kind: 'cutaneous', name: '前臂外侧(肌皮神经)', fibers: [F('musculocutaneous', 'c5 c6', 2)] },
    { id: 's_palm_cut', kind: 'cutaneous', name: '手掌桡侧(正中·掌皮支)', fibers: [F('median', 'c6 c7', 2.8)] },
    { id: 's_fingers_med', kind: 'cutaneous', name: '桡侧3.5指掌面(正中)', fibers: [F('median', 'c6 c7 c8', 4)] },
    { id: 's_med_tips', kind: 'cutaneous', name: '桡侧3.5指中远节指背(正中)', fibers: [F('median', 'c6 c7 c8', 4)] },
    { id: 's_hypo_palm', kind: 'cutaneous', name: '手掌尺侧(尺·掌皮支)', fibers: [F('ulnar', 'c8 t1', 2.8)] },
    { id: 's_fingers_uln', kind: 'cutaneous', name: '尺侧1.5指掌面(尺)', fibers: [F('ulnar', 'c8 t1', 4)] },
    { id: 's_uln_back', kind: 'cutaneous', name: '手背尺侧2.5指(尺·手背支)', fibers: [F('ulnar', 'c8 t1', 2.8)] },
    { id: 's_rad_arm', kind: 'cutaneous', name: '臂/前臂后侧(桡)', fibers: [F('radial', 'c5 c6 c7 c8', 0)] },
    { id: 's_rad_hand', kind: 'cutaneous', name: '手背桡侧2.5指/虎口(桡·浅支)', fibers: [F('radial', 'c6 c7', 2, 'srn')] },

    { id: 'd_c5', kind: 'dermatome', name: 'C5（肩及臂外侧）', fibers: [F('c5', 'c5')] },
    { id: 'd_c6', kind: 'dermatome', name: 'C6（前臂外侧、拇指）', fibers: [F('c6', 'c6')] },
    { id: 'd_c7', kind: 'dermatome', name: 'C7（中指）', fibers: [F('c7', 'c7')] },
    { id: 'd_c8', kind: 'dermatome', name: 'C8（小指、前臂内侧远端）', fibers: [F('c8', 'c8')] },
    { id: 'd_t1', kind: 'dermatome', name: 'T1（臂内侧、前臂内侧近端）', fibers: [F('t1', 't1')] },
  ];

  // 损伤预设。每个预设有一个或多个可选「部位」：
  //   sites  = 被切断的结构（可多个，如 C5+C6 根性撕脱）
  //   lv     = 损伤平面：同一神经上在更近端（lv 更小）已分出的分支不受累
  //   branch = 只损伤该神经的某条具名分支，其余分支不受累
  const LESION_SITES = {
    erb: { def: 'trunk', levels: [
      { key: 'trunk', name: '上干（节后）', sites: ['upper_trunk'] },
      { key: 'root', name: 'C5–C6 根性撕脱（节前）', sites: ['c5', 'c6'] }] },
    klumpke: { def: 'trunk', levels: [
      { key: 'trunk', name: '下干（节后）', sites: ['lower_trunk'] },
      { key: 'root', name: 'C8–T1 根性撕脱（节前）', sites: ['c8', 't1'] }] },
    radial: { def: 'groove', levels: [
      { key: 'axilla', name: '腋部', sites: ['radial'], lv: 0 },
      { key: 'groove', name: '桡神经沟', sites: ['radial'], lv: 1 },
      { key: 'pin', name: '骨间后神经', sites: ['radial'], branch: 'pin' }] },
    median: { def: 'carpal', levels: [
      { key: 'high', name: '肘部以上', sites: ['median'], lv: 1 },
      { key: 'ain', name: '骨间前神经', sites: ['median'], branch: 'ain' },
      { key: 'carpal', name: '腕管', sites: ['median'], lv: 3 }] },
    ulnar: { def: 'wrist', levels: [
      { key: 'elbow', name: '肘管', sites: ['ulnar'], lv: 2 },
      { key: 'wrist', name: '腕部 Guyon 管', sites: ['ulnar'], lv: 3 }] },
    axillary: { def: 'main', levels: [{ key: 'main', name: '四边孔', sites: ['axillary'] }] },
    long_thoracic: { def: 'main', levels: [{ key: 'main', name: '胸侧壁', sites: ['long_thoracic'] }] },
  };

  const outLinks = {};
  LINKS.forEach(([a, b]) => (outLinks[a] = outLinks[a] || []).push(b));
  const targetMap = Object.fromEntries(TARGETS.map(t => [t.id, t]));

  function allPaths(from, to, acc = [from], out = []) {
    if (from === to) { out.push(acc); return out; }
    (outLinks[from] || []).forEach(n => allPaths(n, to, acc.concat(n), out));
    return out;
  }

  // 某条根到某结构的路径（臂丛拓扑下唯一），到不了则为 null
  const pathCache = {};
  function pathOf(root, id) {
    const k = root + '>' + id;
    if (!(k in pathCache)) pathCache[k] = allPaths(root, id)[0] || null;
    return pathCache[k];
  }

  function rootsOf(id) {
    return COMPOSITION[id] || ROOTS.filter(r => pathOf(r, id));
  }

  // 所有「根 → 神经」的纤维路径
  const NERVE_PATHS = [];
  Object.keys(COMPOSITION).forEach(n => COMPOSITION[n].forEach(r => NERVE_PATHS.push(pathOf(r, n))));

  function addPath(p, fromIdx, nodes, edges) {
    for (let i = fromIdx; i < p.length; i++) {
      nodes.add(p[i]);
      if (i > fromIdx) edges.add(p[i - 1] + '>' + p[i]);
    }
  }

  // 双向溯源：up = 该结构的纤维从哪些根、沿哪条路来；down = 流经该结构的纤维去往哪里
  function trace(id) {
    const upNodes = new Set([id]), upEdges = new Set(), downNodes = new Set([id]), downEdges = new Set();
    rootsOf(id).forEach(r => addPath(pathOf(r, id), 0, upNodes, upEdges));
    NERVE_PATHS.forEach(p => { const i = p.indexOf(id); if (i >= 0) addPath(p, i, downNodes, downEdges); });
    return {
      upNodes, upEdges, downNodes, downEdges,
      nodes: new Set([...upNodes, ...downNodes]), edges: new Set([...upEdges, ...downEdges]),
    };
  }

  // 单个靶区自己的路由（例如大鱼际肌只走 C8/T1 → 内侧束 → 正中神经）
  function traceTarget(targetId) {
    const t = targetMap[targetId];
    if (t.kind === 'dermatome') { const tr = trace(t.fibers[0].nerve); return { nodes: tr.nodes, edges: tr.edges }; }
    const nodes = new Set(), edges = new Set();
    t.fibers.forEach(f => f.roots.forEach(r => addPath(pathOf(r, f.nerve), 0, nodes, edges)));
    return { nodes, edges };
  }

  // 一条 fiber 中有多少根的纤维流经 ids 中的任一结构
  function fiberHits(f, ids) {
    return f.roots.filter(r => { const p = pathOf(r, f.nerve); return p && ids.some(id => p.includes(id)); }).length;
  }

  // 有纤维流经 id 的全部靶区
  function targetsFor(id) {
    const rs = rootsOf(id), out = new Set();
    TARGETS.forEach(t => {
      const hit = t.kind === 'dermatome' ? rs.includes(t.fibers[0].nerve) : t.fibers.some(f => fiberHits(f, [id]));
      if (hit) out.add(t.id);
    });
    return out;
  }

  // 损伤：severity = 靶区 id → 'full'（主要节段全断）| 'partial'（部分节段断）；
  // spared = 与损伤在同一神经上、但从损伤点近端或另一条分支走的靶区
  function lesion(key, levelKey) {
    const def = LESION_SITES[key];
    const level = def.levels.find(l => l.key === levelKey) || def.levels.find(l => l.key === def.def);
    const { sites, lv = 0, branch } = level;
    const isNerve = sites.every(s => s in COMPOSITION);
    const severity = new Map(), spared = [];
    TARGETS.forEach(t => {
      if (t.kind === 'dermatome') {
        // 皮节只对根/干/束水平的损伤有意义；周围神经损伤按周围皮区分布
        if (!isNerve && sites.some(s => rootsOf(s).includes(t.fibers[0].nerve))) severity.set(t.id, 'full');
        return;
      }
      let total = 0, hit = 0, bypass = false;
      t.fibers.forEach(f => {
        total += f.roots.length;
        const n = fiberHits(f, sites);
        if (!n) return;
        if (sites.includes(f.nerve) && (branch ? f.via !== branch : f.lv < lv)) bypass = true;
        else hit += n;
      });
      if (hit) severity.set(t.id, hit === total ? 'full' : 'partial');
      else if (bypass) spared.push(t.id);
    });
    const tr = { upNodes: new Set(), upEdges: new Set(), downNodes: new Set(), downEdges: new Set(), nodes: new Set(), edges: new Set() };
    sites.forEach(s => { const one = trace(s); Object.keys(tr).forEach(k => one[k].forEach(v => tr[k].add(v))); });
    return {
      key, level: level.key, levelName: level.name, sites: new Set(sites), isNerve, branch: !!branch,
      // 节前 = 全部损伤点都在根；Horner 征 = T1 根在发出白交通支之前受损
      preganglionic: sites.every(s => ROOTS.includes(s)), horner: sites.includes('t1'),
      severity, spared, ...tr,
    };
  }

  function segLabel(id) {
    const idx = rootsOf(id).map(r => ROOTS.indexOf(r));
    const names = idx.map(i => ROOTS[i].toUpperCase());
    const contiguous = idx.every((v, i) => i === 0 || v === idx[i - 1] + 1);
    return names.length > 1 && contiguous ? names[0] + '–' + names[names.length - 1] : names.join(', ');
  }

  return {
    ROOTS, LINKS, COMPOSITION, TARGETS, LESION_SITES,
    target: id => targetMap[id], pathOf, rootsOf, trace, traceTarget, targetsFor, lesion, segLabel,
  };
})();

function getColorForNode(n) {
  if (n.stage === 'root') return 'var(--root-color)';
  if (n.stage === 'trunk') return 'var(--trunk-color)';
  if (n.stage === 'division') return n.divisionType === 'post' ? 'var(--post-color)' : 'var(--ant-color)';
  if (n.stage === 'cord') return 'var(--cord-color)';
  if (n.stage === 'branch') return 'var(--branch-color)';
  return 'var(--collateral-color)';
}

function getEdgeColor(e) {
  if (e.type === 'post') return 'var(--post-color)';
  if (e.type === 'ant') return 'var(--ant-color)';
  if (e.type === 'collateral') return 'var(--collateral-color)';
  return 'var(--trunk-color)';
}

function buildCurve(fromNode, toNode, isCollateral) {
  const x1 = fromNode.x + fromNode.w / 2;
  const y1 = fromNode.y;
  const x2 = toNode.x - toNode.w / 2;
  const y2 = toNode.y;
  if (isCollateral && toNode.dock === 'gap') {
    // 夹在「根」「干」两列之间的旁支（胸长神经）：从各条根的右缘出发，接到节点的上/下缘，
    // 这样连线不会穿过别的根。
    const down = toNode.y > fromNode.y;
    const sx = x1, sy = fromNode.y + (down ? 13 : -13);
    const far = Math.abs(toNode.y - fromNode.y) > 100;
    const tx = toNode.x + (down ? (far ? 8 : -14) : 0);
    const ty = toNode.y + (down ? -toNode.h / 2 : toNode.h / 2);
    return `M ${sx} ${sy} C ${tx} ${sy}, ${tx} ${sy}, ${tx} ${ty}`;
  }
  if (isCollateral) {
    const sx = fromNode.x;
    const sy = toNode.y < fromNode.y ? fromNode.y - fromNode.h / 2 : fromNode.y + fromNode.h / 2;
    const tx = toNode.x - toNode.w / 2;
    const ty = toNode.y;
    const mx = (sx + tx) / 2;
    return `M ${sx} ${sy} C ${sx} ${ty}, ${mx} ${ty}, ${tx} ${ty}`;
  }
  const dx = (x2 - x1) * 0.52;
  return `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;
}

function createSvgEl(tag, attrs = {}) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

// ---- 状态操作（按钮、键盘、网址都走这里） ----
function clearFocus() {
  state.selectedId = null;
  state.hoverId = null;
  state.lesionKey = null;
  state.lesionLevel = null;
  state.selectedZoneId = null;
}

function exitQuiz() {
  if (!state.quizMode) return;
  state.quizMode = false;
  state.quizPicks = new Set();
  renderPlexusSVG();
}

function setLesion(key, level) {
  exitQuiz();
  state.lesionKey = key || null;
  state.lesionLevel = key ? (level || null) : null;
  state.selectedId = null;
  state.selectedZoneId = null;
  if (key === 'long_thoracic' && !state.showCollaterals) {
    state.showCollaterals = true;
    renderPlexusSVG();
  }
  updateUI();
}

function currentLevel() {
  if (!state.lesionKey) return null;
  return state.lesionLevel || PlexusModel.LESION_SITES[state.lesionKey].def;
}

function stepLevel(delta) {
  if (!state.lesionKey) return;
  const levels = PlexusModel.LESION_SITES[state.lesionKey].levels;
  const i = levels.findIndex(l => l.key === currentLevel());
  const j = Math.max(0, Math.min(levels.length - 1, i + delta));
  if (j !== i) setLesion(state.lesionKey, levels[j].key);
}

function stepLesion(delta) {
  const seq = [null, ...LESION_KEYS];
  const i = seq.indexOf(state.lesionKey);
  setLesion(seq[(i + delta + seq.length) % seq.length]);
}

function setLimbMode(mode) {
  state.limbMode = mode;
  state.selectedZoneId = null;
  renderLimbSVG();
  updateUI();
}

// 自测时是否把节点名字换成「？」（反向题考的是右侧图，不用藏名字）
function labelsHidden() {
  return state.quizMode && !state.quizAnswered && !currentQuiz().zones;
}

function renderPlexusSVG() {
  svg.innerHTML = '';
  const bgRect = createSvgEl('rect', { x: 0, y: 0, width: 1060, height: 620, fill: 'transparent' });
  bgRect.addEventListener('click', () => {
    if (state.quizMode) return;
    clearFocus();
    updateUI();
  });
  svg.appendChild(bgRect);

  STAGES.forEach((s, idx) => {
    const t1 = createSvgEl('text', { x: s.x, y: 24, 'text-anchor': 'middle', class: 'stage-header' });
    t1.textContent = s.title;
    svg.appendChild(t1);
    const t2 = createSvgEl('text', { x: s.x, y: 40, 'text-anchor': 'middle', class: 'stage-sub' });
    t2.textContent = s.sub;
    svg.appendChild(t2);
    if (idx < STAGES.length - 1) {
      const midX = (s.x + STAGES[idx + 1].x) / 2;
      svg.appendChild(createSvgEl('line', { x1: midX, y1: 48, x2: midX, y2: 610, class: 'stage-divider' }));
    }
  });

  const edgeLayer = createSvgEl('g');
  const pulseLayer = createSvgEl('g');

  EDGES.forEach((e) => {
    if (e.type === 'collateral' && !state.showCollaterals) return;
    const d = buildCurve(nodeMap[e.from], nodeMap[e.to], e.type === 'collateral');
    edgeLayer.appendChild(createSvgEl('path', {
      d,
      class: `edge ${e.type === 'post' ? 'posterior' : ''} ${e.type === 'collateral' ? 'collateral-edge' : ''}`,
      stroke: getEdgeColor(e),
      'data-from': e.from,
      'data-to': e.to
    }));
    pulseLayer.appendChild(createSvgEl('path', {
      d,
      class: 'pulse-edge',
      'data-from': e.from,
      'data-to': e.to
    }));
  });

  svg.appendChild(edgeLayer);
  svg.appendChild(pulseLayer);

  const hideLabel = labelsHidden();
  const nodeLayer = createSvgEl('g');
  NODES.forEach(n => {
    const isCol = n.stage === 'collateral';
    if (isCol && !state.showCollaterals) return;
    const g = createSvgEl('g', { class: 'node-group', 'data-id': n.id });

    g.appendChild(createSvgEl('rect', {
      x: n.x - n.w / 2, y: n.y - n.h / 2, width: n.w, height: n.h,
      class: isCol ? 'node-rect collateral-rect' : 'node-rect',
      stroke: getColorForNode(n)
    }));

    // 旁支的第二行是节段，由模型推导
    const subText = isCol ? PlexusModel.segLabel(n.id) : n.sub;
    const label = createSvgEl('text', {
      x: n.x, y: n.y - (isCol ? 2 : 4), 'text-anchor': 'middle',
      class: isCol ? 'collateral-label' : 'node-label'
    });
    label.textContent = hideLabel ? '？' : n.label;
    g.appendChild(label);

    const sub = createSvgEl('text', { x: n.x, y: n.y + (isCol ? 11 : 13), 'text-anchor': 'middle', class: 'node-sub' });
    sub.textContent = hideLabel ? (isCol ? '旁支' : n.stage.toUpperCase()) : subText;
    g.appendChild(sub);

    g.addEventListener('mouseenter', () => {
      if (state.quizMode) return;
      state.hoverId = n.id;
      applyAllHighlights();
    });
    g.addEventListener('mouseleave', () => {
      if (state.quizMode) return;
      state.hoverId = null;
      applyAllHighlights();
    });
    g.addEventListener('click', (ev) => {
      ev.stopPropagation();
      if (state.quizMode) { handleQuizAnswer(n.id); return; }
      const next = state.selectedId === n.id && !state.selectedZoneId ? null : n.id;
      clearFocus();
      state.selectedId = next;
      updateUI();
    });

    nodeLayer.appendChild(g);
  });

  svg.appendChild(nodeLayer);
}

function renderLimbSVG() {
  limbSvg.innerHTML = '';

  const defs = createSvgEl('defs');
  const clip = createSvgEl('clipPath', { id: 'limbClip' });
  clip.appendChild(createSvgEl('path', { d: LIMB_TORSO }));
  clip.appendChild(createSvgEl('path', { d: LIMB_ARM }));
  defs.appendChild(clip);
  limbSvg.appendChild(defs);

  [['前面观（掌侧）', 110], ['后面观（背侧）', LIMB_W - 110]].forEach(([txt, x]) => {
    const t = createSvgEl('text', { x, y: 15, 'text-anchor': 'middle', class: 'limb-view-title' });
    t.textContent = txt;
    limbSvg.appendChild(t);
  });

  const labelLayer = createSvgEl('g');
  const big = state.limbMode === 'dermatome';

  ['a', 'p'].forEach(v => {
    const flip = v === 'p';
    const fx = x => flip ? LIMB_W - x : x;
    const g = createSvgEl('g', flip ? { transform: `translate(${LIMB_W},0) scale(-1,1)` } : {});
    g.appendChild(createSvgEl('path', { d: LIMB_TORSO, class: 'limb-fill' }));
    g.appendChild(createSvgEl('path', { d: LIMB_ARM, class: 'limb-fill' }));

    const zoneLayer = createSvgEl('g', { 'clip-path': 'url(#limbClip)' });
    LIMB_ZONES[state.limbMode].filter(z => z.v === v).forEach(z => {
      const t = PlexusModel.target(z.id);
      const p = createSvgEl('path', { d: z.d, class: 'zone-shape', 'data-zone': z.id });
      p.addEventListener('click', () => {
        if (state.quizMode) { toggleQuizPick(z.id); return; }
        selectZone(z.id);
      });
      const titleEl = createSvgEl('title');
      titleEl.textContent = t.name;
      p.appendChild(titleEl);
      zoneLayer.appendChild(p);

      const [lx0, ly, a0] = z.lab;
      const lx = fx(lx0);
      const anchor = !flip || a0 === 'middle' ? a0 : (a0 === 'end' ? 'start' : 'end');
      if (z.pt) {
        const ex = lx + (anchor === 'end' ? 2.5 : -2.5);
        labelLayer.appendChild(createSvgEl('line', {
          x1: ex, y1: ly - 3.5, x2: fx(z.pt[0]), y2: z.pt[1], class: 'zone-leader', 'data-zone': z.id
        }));
        labelLayer.appendChild(createSvgEl('circle', { cx: fx(z.pt[0]), cy: z.pt[1], r: 1.5, class: 'zone-leader-dot', 'data-zone': z.id }));
      }
      const attrs = { x: lx, y: ly, 'text-anchor': anchor, class: 'zone-label' + (big ? ' big' : ''), 'data-zone': z.id };
      if (z.rot) attrs.transform = `rotate(${flip ? -z.rot : z.rot} ${lx} ${ly - 3})`;
      const lbl = createSvgEl('text', attrs);
      lbl.textContent = z.t;
      labelLayer.appendChild(lbl);
    });
    g.appendChild(zoneLayer);

    g.appendChild(createSvgEl('path', { d: LIMB_ARM + ' ' + LIMB_TORSO_EDGE, class: 'limb-contour' }));
    if (state.limbMode === 'motor') g.appendChild(createSvgEl('path', { d: LIMB_MARKS[v], class: 'limb-mark' }));
    limbSvg.appendChild(g);
  });

  limbSvg.appendChild(labelLayer);
}

function selectZone(zoneId) {
  const t = PlexusModel.target(zoneId);
  const nerve = t.fibers[0].nerve;
  clearFocus();
  state.selectedId = nerve;
  state.selectedZoneId = zoneId;
  if (nodeMap[nerve].stage === 'collateral' && !state.showCollaterals) {
    state.showCollaterals = true;
    renderPlexusSVG();
  }
  updateUI();
}

// 当前要高亮的内容，全部来自 PlexusModel（纤维路由），不再按图的连通性推断
let ctxCache = { key: null, value: null };
function getActiveNodeContext() {
  const key = [state.lesionKey, state.lesionLevel, state.hoverId, state.selectedId, state.selectedZoneId].join('|');
  if (key !== ctxCache.key) ctxCache = { key, value: buildNodeContext() };
  return ctxCache.value;
}

// sites = 要打上「选中/损伤点」标记的节点（根性撕脱时不止一个）
function buildNodeContext() {
  if (state.lesionKey) {
    return { ...PlexusModel.lesion(state.lesionKey, state.lesionLevel), isLesion: true };
  }
  const one = id => ({ ...PlexusModel.trace(id), activeId: id, sites: new Set([id]), isLesion: false });
  if (state.hoverId) return one(state.hoverId);
  if (!state.selectedId) return null;
  if (state.selectedZoneId) {
    return {
      ...PlexusModel.traceTarget(state.selectedZoneId),
      activeId: state.selectedId, sites: new Set([state.selectedId]), zoneId: state.selectedZoneId, isLesion: false
    };
  }
  return one(state.selectedId);
}

function applyAllHighlights() {
  const ctx = getActiveNodeContext();
  const nodeEls = svg.querySelectorAll('.node-group');
  const edgeEls = svg.querySelectorAll('.edge');
  const pulseEls = svg.querySelectorAll('.pulse-edge');
  const keyOf = el => el.getAttribute('data-from') + '>' + el.getAttribute('data-to');

  if (!ctx) {
    nodeEls.forEach(el => el.classList.remove('dim', 'selected', 'lesion-site'));
    edgeEls.forEach(el => el.classList.remove('dim', 'highlight', 'lesion-downstream'));
    pulseEls.forEach(el => el.classList.add('active-pulse'));
    applyLimbHighlights(null);
    return;
  }

  nodeEls.forEach(el => {
    const id = el.getAttribute('data-id');
    el.classList.toggle('dim', !ctx.nodes.has(id));
    el.classList.toggle('lesion-site', ctx.isLesion && ctx.sites.has(id));
    el.classList.toggle('selected', !ctx.isLesion && ctx.sites.has(id));
  });

  if (ctx.isLesion) {
    edgeEls.forEach(el => {
      const isDown = ctx.downEdges.has(keyOf(el));
      const isUp = ctx.upEdges.has(keyOf(el));
      el.classList.toggle('lesion-downstream', isDown);
      el.classList.toggle('highlight', isUp && !isDown);
      el.classList.toggle('dim', !isDown && !isUp);
    });
    pulseEls.forEach(el => el.classList.toggle('active-pulse', ctx.upEdges.has(keyOf(el)) && !ctx.downEdges.has(keyOf(el))));
  } else {
    edgeEls.forEach(el => {
      const onPath = ctx.edges.has(keyOf(el));
      el.classList.toggle('highlight', onPath);
      el.classList.toggle('dim', !onPath);
      el.classList.remove('lesion-downstream');
    });
    pulseEls.forEach(el => el.classList.toggle('active-pulse', ctx.edges.has(keyOf(el))));
  }

  applyLimbHighlights(ctx);
}

function applyLimbHighlights(ctx) {
  const zoneEls = limbSvg.querySelectorAll('.zone-shape');
  const labelEls = limbSvg.querySelectorAll('.zone-label, .zone-leader, .zone-leader-dot');
  const activeChips = document.getElementById('activeChips');
  const caption = document.getElementById('limbCaption');
  activeChips.innerHTML = '';
  zoneEls.forEach(el => {
    el.classList.remove('active-motor', 'active-sensory', 'active-lesion', 'active-lesion-partial');
    el.classList.toggle('picked', state.quizMode && state.quizPicks.has(el.getAttribute('data-zone')));
  });
  labelEls.forEach(el => el.classList.remove('on', 'lesion'));

  if (state.quizMode && !state.quizAnswered && currentQuiz().zones) {
    caption.textContent = `已选 ${state.quizPicks.size} 个`;
    return;
  }
  if (!ctx) {
    caption.textContent = '';
    return;
  }

  const isMotor = state.limbMode === 'motor';
  const zoneTarget = ctx.zoneId ? PlexusModel.target(ctx.zoneId) : null;
  const siteName = ctx.isLesion ? ctx.levelName : nodeMap[ctx.activeId].label;

  // 靶区 id → 高亮样式
  const hits = new Map();
  if (ctx.isLesion) {
    ctx.severity.forEach((sev, id) => hits.set(id, sev === 'full' ? 'active-lesion' : 'active-lesion-partial'));
  } else {
    const ids = zoneTarget ? [ctx.zoneId] : PlexusModel.targetsFor(ctx.activeId);
    ids.forEach(id => hits.set(id, isMotor ? 'active-motor' : 'active-sensory'));
  }

  const matched = new Map();
  zoneEls.forEach(el => {
    const id = el.getAttribute('data-zone');
    if (!hits.has(id)) return;
    el.classList.add(hits.get(id));
    matched.set(id, hits.get(id) === 'active-lesion-partial');
  });
  labelEls.forEach(el => {
    if (!hits.has(el.getAttribute('data-zone'))) return;
    el.classList.add('on');
    if (ctx.isLesion) el.classList.add('lesion');
  });

  // 同一神经上没被这次损伤波及的分支
  const spared = ctx.isLesion
    ? ctx.spared.map(id => PlexusModel.target(id)).filter(t => t.kind === state.limbMode).map(t => t.name)
    : [];
  const sparedNote = !spared.length ? ''
    : ctx.branch ? ` · 只伤到${ctx.levelName}这一条分支，同一神经的其余分支保留：${spared.join('、')}`
    : ` · 损伤在${ctx.levelName}，更近端已分出的分支保留：${spared.join('、')}`;

  if (ctx.isLesion && state.limbMode === 'dermatome' && ctx.isNerve) {
    caption.textContent = '周围神经损伤不按皮节分布，请看「周围皮区」';
  } else if (matched.size === 0) {
    caption.textContent = ctx.isLesion
      ? `${siteName}损伤不累及当前图中的${isMotor ? '肌肉' : '皮区'}${sparedNote}`
      : (isMotor
        ? `「${siteName}」为纯感觉神经，或图中没有画出它支配的肌肉`
        : `「${siteName}」为纯运动神经，无独立皮肤感觉区`);
  } else if (ctx.isLesion) {
    caption.textContent = (isMotor ? '受累肌肉' : '感觉减退区域') + sparedNote;
  } else if (zoneTarget) {
    const segs = PlexusModel.ROOTS.filter(r => zoneTarget.fibers.some(f => f.roots.includes(r))).map(r => r.toUpperCase()).join('、');
    caption.textContent = zoneTarget.kind === 'dermatome'
      ? `已从「${zoneTarget.name}」定位至 ${siteName}`
      : `已从「${zoneTarget.name}」反向溯源至 ${siteName}（主要节段 ${segs}）`;
  } else {
    caption.textContent = '';
  }

  matched.forEach((partial, id) => {
    const chip = document.createElement('span');
    chip.className = `mini-chip ${ctx.isLesion ? 'lesion' : ''}`;
    const name = PlexusModel.target(id).name;
    chip.textContent = partial ? `${name}（部分）` : name;
    chip.addEventListener('click', () => { if (!state.quizMode) selectZone(id); });
    activeChips.appendChild(chip);
  });
}

  const dTitle = document.getElementById('dTitle');
  const dSub = document.getElementById('dSub');
  const dSegments = document.getElementById('dSegments');
  const dMotor = document.getElementById('dMotor');

  const dSpatial = document.getElementById('dSpatial');

  if (state.lesionKey) {
    const L = LESIONS[state.lesionKey];
    const ctx = PlexusModel.lesion(state.lesionKey, state.lesionLevel);
    const T = L.levels[ctx.level];
    let tags = `<span class="tag lesion">临床损伤模拟</span><span class="tag lesion">部位：${ctx.levelName}</span>`;
    if (!ctx.isNerve) {
      tags += `<span class="tag">${ctx.preganglionic ? '节前（根性）损伤' : '节后损伤'}</span>`
        + `<span class="tag">Horner 征：${ctx.horner ? '有' : '无'}</span>`;
    }
    dTags.innerHTML = tags;
    dTitle.textContent = L.title;
    dSub.textContent = L.sub;

    dMotor.textContent = T.motor;
    dSensory.textContent = T.sensory;
    dClinical.textContent = T.clinical;
    dSpatial.textContent = L.spatial;

  }

  if (!state.selectedId) {
    dTags.innerHTML = `<span class="tag">总览模式</span><span class="tag">C5–T1</span>`;
    dTitle.textContent = '臂丛神经总览';
    dSub.textContent = 'Brachial Plexus · 腕神経叢 (C5–T1)';
    dSegments.textContent = '由 C5–C8 及 T1 脊神经前支组成，经前、中斜角肌间隙穿出，跨越第 1 肋进入腋窝。';
    dMotor.textContent = '前股系统（外侧束、内侧束）主要支配屈肌群；后股系统全部汇合为后束，支配伸肌群。';
    dSensory.textContent = '皮节：C5 肩及臂外侧，C6 前臂外侧与拇指，C7 中指，C8 小指与前臂内侧远端，T1 臂内侧。';
    dClinical.textContent = '上臂丛损伤（Erb）累及肩外展与屈肘；下臂丛损伤（Klumpke）累及手内在肌。';
    dSpatial.textContent = '三干的后股向深面汇合于腋动脉后方形成后束；前股居于动脉前方形成外侧束与内侧束，并在动脉前方合成“M”形正中神经。';
    return;
  }

  const n = nodeMap[state.selectedId];
  const stageNames = { root: '神经根', trunk: '神经干', division: '神经股', cord: '神经束', branch: '终末支', collateral: '重要旁支' };
  dTags.innerHTML = `<span class="tag">${stageNames[n.stage]}</span><span class="tag">节段：${PlexusModel.segLabel(n.id)}</span>`;
  dTitle.textContent = n.label;
  dSub.textContent = n.en;
  dSegments.textContent = `脊髓节段来源：${PlexusModel.segLabel(n.id)}`;
  dMotor.textContent = n.motor;
  dSensory.textContent = n.sensory;
  dClinical.textContent = n.clinical;
  dSpatial.textContent = NODE_3D[n.id].spatial;
}

// ---- 自测 ----
let quizOrder = [];
function currentQuiz() {
  return QUIZ_BANK[quizOrder[state.quizIdx % quizOrder.length]];
}

function showQuizScore() {
  document.getElementById('quizScore').textContent = `得分：${state.quizRight} / ${state.quizTotal}`;
}

function setQuizFeedback(text, cls) {
  const fb = document.getElementById('quizFeedback');
  fb.textContent = text;
  fb.className = 'quiz-feedback' + (cls ? ' ' + cls : '');
}

function loadQuizQuestion() {
  // 每做完一轮重新洗牌
  if (state.quizIdx % QUIZ_BANK.length === 0 || !quizOrder.length) {
    quizOrder = QUIZ_BANK.map((_, i) => i);
    for (let i = quizOrder.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [quizOrder[i], quizOrder[j]] = [quizOrder[j], quizOrder[i]];
    }
  }
  const item = currentQuiz();
  state.quizAnswered = false;
  state.quizPicks = new Set();
  clearFocus();
  if (item.zones) state.limbMode = item.zones.mode;
  document.getElementById('quizQuestion').textContent = item.zones
    ? item.q + '（在上肢图上点选，可以为空）'
    : item.q;
  setQuizFeedback('');
  showQuizScore();
  renderPlexusSVG();
  renderLimbSVG();
  updateUI();
}

function handleQuizAnswer(clickedId) {
  const item = currentQuiz();
  if (state.quizAnswered || item.zones) return;
  state.quizAnswered = true;
  state.quizTotal++;
  if (clickedId === item.target) {
    state.quizRight++;
    setQuizFeedback(`✅ 回答正确！就是「${nodeMap[item.target].label}」。`, 'ok');
  } else {
    setQuizFeedback(`❌ 你点了「${nodeMap[clickedId].label}」，正确答案是「${nodeMap[item.target].label}」。`, 'err');
  }
  state.selectedId = item.target;
  showQuizScore();
  renderPlexusSVG();
  updateUI();
}

function toggleQuizPick(zoneId) {
  if (state.quizAnswered || !currentQuiz().zones) return;
  if (state.quizPicks.has(zoneId)) state.quizPicks.delete(zoneId);
  else state.quizPicks.add(zoneId);
  applyAllHighlights();
}

// 反向题：把点选的区域和模型算出的受累区域比对。reveal = 直接看答案，不计分
function submitZoneQuiz(reveal) {
  const item = currentQuiz();
  if (state.quizAnswered || !item.zones) return;
  const L = PlexusModel.lesion(item.zones.lesion, item.zones.level);
  const answer = [...L.severity.keys()].filter(id => PlexusModel.target(id).kind === item.zones.mode);
  const names = ids => ids.map(id => PlexusModel.target(id).name).join('、');
  const answerText = answer.length ? names(answer) : '没有（这个部位的损伤不影响这一类区域）';
  state.quizAnswered = true;
  if (reveal) {
    setQuizFeedback(`💡 答案：${answerText}。`);
  } else {
    state.quizTotal++;
    const missed = answer.filter(id => !state.quizPicks.has(id));
    const extra = [...state.quizPicks].filter(id => !answer.includes(id));
    if (!missed.length && !extra.length) {
      state.quizRight++;
      setQuizFeedback(`✅ 完全正确：${answerText}。`, 'ok');
    } else {
      setQuizFeedback('❌ ' + [missed.length ? `漏选：${names(missed)}` : '', extra.length ? `多选：${names(extra)}` : '']
        .filter(Boolean).join('；') + '。红色为正确答案。', 'err');
    }
  }
  state.quizPicks = new Set();
  state.lesionKey = item.zones.lesion;
  state.lesionLevel = item.zones.level;
  showQuizScore();
  renderPlexusSVG();
  updateUI();
}

let dragging = false, dragMoved = false, lastX = 0, lastY = 0;
let projectedNodes = [];
let vpW = 0, vpH = 0, rafId = null;

function sampleCurve3D(a, b, steps = 16) {
  const dx = (b.x - a.x) * 0.52;
  const p1 = { x: a.x + dx, y: a.y, z: a.z }, p2 = { x: b.x - dx, y: b.y, z: b.z };
  const pts = [];
  for (let i = 0; i <= steps; i++) {
    const t = i / steps, u = 1 - t;
    const k0 = u * u * u, k1 = 3 * u * u * t, k2 = 3 * u * t * t, k3 = t * t * t;
    pts.push({
      x: k0 * a.x + k1 * p1.x + k2 * p2.x + k3 * b.x,
      y: k0 * a.y + k1 * p1.y + k2 * p2.y + k3 * b.y,
      z: k0 * a.z + k1 * p1.z + k2 * p2.z + k3 * b.z
    });
  }
  return pts;
}

// 锁骨下动脉 → 腋动脉：自下干前下方进入，行于三束之间
const ARTERY_PTS = [];
for (let i = 0; i <= 28; i++) {
  const t = i / 28, k = Math.pow(1 - t, 1.8);
  ARTERY_PTS.push({ x: -172 + t * 432, y: 128 * k + 8 * (1 - k) + Math.sin(t * Math.PI) * 6, z: 24 * (1 - t) + 6 * t });
}
// 锁骨：位于“股”的前方，分隔锁骨上部（根/干）与锁骨下部（束/终末支）
const CLAVICLE_PTS = [];
for (let i = 0; i <= 22; i++) {
  const t = i / 22;
  CLAVICLE_PTS.push({ x: -18 + Math.sin(t * Math.PI * 1.4) * 12, y: -158 + t * 316, z: 82 + Math.sin(t * Math.PI) * 10 });
}
// 每条根内侧的示意方块（代表其出椎间孔处，不是逐块椎体）
const VERTEBRAE = PlexusModel.ROOTS.map(r => ({ x: -268, y: NODE_3D[r].y, z: -18 }));

const EDGE_SAMPLES = EDGES.map(e => {
  const toStage = nodeMap[e.to].stage;
  return {
    key: e.from + '>' + e.to,
    collateral: e.type === 'collateral',
    color: (toStage === 'cord' || toStage === 'branch') ? NODE_3D[e.to].color : EDGE_3D_COLOR[e.type],
    r: e.type === 'collateral' ? 1.9 : (e.type === 'main' ? 3.4 : 3.2),
    pts: sampleCurve3D(NODE_3D[e.from], NODE_3D[e.to])
  };
});

function project(p) {
  const cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw), cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  const x1 = p.x * cy - p.z * sy, z1 = p.x * sy + p.z * cy;
  const y2 = p.y * cp - z1 * sp, z2 = p.y * sp + z1 * cp;
  const scale = (cam.fov / (cam.fov - z2)) * cam.zoom * Math.min(vpW / 680, vpH / 470, 1.35);
  return { sx: vpW * 0.5 + x1 * scale, sy: vpH * 0.52 + y2 * scale, z: z2, scale };
}

function resizeCanvas() {
  const rect = viewport3d.getBoundingClientRect();
  if (!rect.width || !rect.height) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  vpW = rect.width; vpH = rect.height;
  canvas.width = vpW * dpr;
  canvas.height = vpH * dpr;
  ctx3d.setTransform(dpr, 0, 0, dpr, 0, 0);
}
new ResizeObserver(resizeCanvas).observe(viewport3d);

function render(ts) {
  const timeSec = ts * 0.001;
  const show = state.show3d;
  if (show.auto && !dragging) cam.targetYaw += 0.0055;
  cam.yaw += (cam.targetYaw - cam.yaw) * 0.12;
  cam.pitch += (cam.targetPitch - cam.pitch) * 0.12;
  cam.zoom += (cam.targetZoom - cam.zoom) * 0.12;

  ctx3d.clearRect(0, 0, vpW, vpH);
  const hl = getActiveNodeContext();
  const hideNames = labelsHidden();
  const drawList = [];
  const stroke = (a, b, color, width) => {
    ctx3d.beginPath();
    ctx3d.moveTo(a.sx, a.sy);
    ctx3d.lineTo(b.sx, b.sy);
    ctx3d.lineCap = 'round';
    ctx3d.strokeStyle = color;
    ctx3d.lineWidth = width;
    ctx3d.stroke();
  };
  const caption = (text, p, dy, color) => drawList.push({ z: p.z + 3, draw: () => {
    ctx3d.font = `600 11px ${FONT_3D}`;
    ctx3d.fillStyle = color;
    ctx3d.textAlign = 'center';
    ctx3d.fillText(text, p.sx, p.sy + dy * p.scale);
  }});

  // 1. 参考网格
  const gridLine = (p, q) => {
    const a = project(p), b = project(q);
    drawList.push({ z: (a.z + b.z) / 2 - 400, draw: () => stroke(a, b, 'rgba(148, 163, 184, 0.07)', 1) });
  };
  for (let gx = -260; gx <= 260; gx += 65) gridLine({ x: gx, y: 185, z: -110 }, { x: gx, y: 185, z: 110 });
  for (let gz = -110; gz <= 110; gz += 55) gridLine({ x: -260, y: 185, z: gz }, { x: 260, y: 185, z: gz });

  // 2. 骨性标志
  if (show.bones) {
    VERTEBRAE.forEach(v => {
      const p = project(v);
      drawList.push({ z: p.z, draw: () => {
        const rw = 20 * p.scale, rh = 16 * p.scale;
        ctx3d.fillStyle = 'rgba(203, 213, 225, 0.16)';
        ctx3d.strokeStyle = 'rgba(203, 213, 225, 0.34)';
        ctx3d.lineWidth = 1.2;
        ctx3d.beginPath();
        ctx3d.roundRect(p.sx - rw, p.sy - rh, rw * 2, rh * 2, 6 * p.scale);
        ctx3d.fill();
        ctx3d.stroke();
      }});
    });
    for (let i = 0; i < CLAVICLE_PTS.length - 1; i++) {
      const a = project(CLAVICLE_PTS[i]), b = project(CLAVICLE_PTS[i + 1]);
      const sc = (a.scale + b.scale) / 2;
      drawList.push({ z: (a.z + b.z) / 2, draw: () => {
        stroke(a, b, 'rgba(226, 232, 240, 0.22)', 15 * sc);
        stroke(a, b, 'rgba(248, 250, 252, 0.18)', 5 * sc);
      }});
    }
    if (show.labels) caption('锁骨', project(CLAVICLE_PTS[10]), -14, 'rgba(226, 232, 240, 0.65)');
  }

  // 3. 腋动脉
  if (show.artery) {
    const beat = 1 + Math.sin(timeSec * 4.5) * 0.04;
    for (let i = 0; i < ARTERY_PTS.length - 1; i++) {
      const a = project(ARTERY_PTS[i]), b = project(ARTERY_PTS[i + 1]);
      const sc = (a.scale + b.scale) / 2 * beat;
      drawList.push({ z: (a.z + b.z) / 2, draw: () => {
        stroke(a, b, 'rgba(220, 38, 38, 0.52)', 14.5 * sc);
        stroke(a, b, 'rgba(252, 165, 165, 0.32)', 4.2 * sc);
      }});
    }
    if (show.labels) caption('腋动脉', project(ARTERY_PTS[14]), 18, '#fca5a5');
  }

  // 4. 神经（分段、按深度排序）
  EDGE_SAMPLES.forEach((edge, eIdx) => {
    if (edge.collateral && !state.showCollaterals) return;
    let alpha = 0.85, color = edge.color, widthBoost = 1.0, showPulse = state.pulse;
    if (hl) {
      if (hl.isLesion && hl.downEdges.has(edge.key)) { color = LESION_3D_COLOR; alpha = 1.0; widthBoost = 1.35; showPulse = false; }
      else if (hl.isLesion && hl.upEdges.has(edge.key)) { alpha = 0.95; widthBoost = 1.2; }
      else if (!hl.isLesion && hl.edges.has(edge.key)) { alpha = 1.0; widthBoost = 1.32; }
      else { alpha = 0.13; showPulse = false; }
    }

    const pts = edge.pts;
    for (let i = 0; i < pts.length - 1; i++) {
      const a = project(pts[i]), b = project(pts[i + 1]);
      const w = edge.r * (a.scale + b.scale) / 2 * widthBoost;
      drawList.push({ z: (a.z + b.z) / 2, draw: () => {
        ctx3d.globalAlpha = alpha;
        stroke(a, b, color, w * 2.1);
        stroke(a, b, 'rgba(255,255,255,0.34)', w * 0.65);
        ctx3d.globalAlpha = 1;
      }});
    }

    if (showPulse) {
      const idxF = ((timeSec * 0.55 + eIdx * 0.17) % 1) * (pts.length - 1);
      const i0 = Math.floor(idxF), f = idxF - i0;
      const p0 = pts[i0], p1 = pts[Math.min(i0 + 1, pts.length - 1)];
      const pp = project({ x: p0.x + (p1.x - p0.x) * f, y: p0.y + (p1.y - p0.y) * f, z: p0.z + (p1.z - p0.z) * f });
      drawList.push({ z: pp.z + 1, draw: () => {
        const rad = 9.1 * pp.scale;
        const grad = ctx3d.createRadialGradient(pp.sx, pp.sy, 0, pp.sx, pp.sy, rad);
        grad.addColorStop(0, 'rgba(255,255,255,0.98)');
        grad.addColorStop(0.45, color);
        grad.addColorStop(1, 'rgba(255,255,255,0)');
        ctx3d.fillStyle = grad;
        ctx3d.beginPath();
        ctx3d.arc(pp.sx, pp.sy, rad, 0, Math.PI * 2);
        ctx3d.fill();
      }});
    }
  });

  // 5. 节点
  projectedNodes = [];
  NODES.forEach(n => {
    if (n.stage === 'collateral' && !state.showCollaterals) return;
    const n3 = NODE_3D[n.id];
    const p = project(n3);
    const radius = n3.r * p.scale;
    projectedNodes.push({ id: n.id, sx: p.sx, sy: p.sy, z: p.z, r: Math.max(radius, 11) });

    const related = !hl || hl.nodes.has(n.id);
    const isFocal = !!hl && hl.sites.has(n.id);
    const nodeColor = hl && hl.isLesion && hl.downNodes.has(n.id) ? LESION_3D_COLOR : n3.color;

    drawList.push({ z: p.z + 2, draw: () => {
      ctx3d.globalAlpha = related ? 0.96 : 0.16;
      if (isFocal) {
        const pulse = 1 + Math.sin(timeSec * 6) * 0.2;
        const halo = ctx3d.createRadialGradient(p.sx, p.sy, radius * 0.6, p.sx, p.sy, radius * 2.7 * pulse);
        halo.addColorStop(0, hl.isLesion ? 'rgba(244,63,94,0.75)' : 'rgba(56,189,248,0.7)');
        halo.addColorStop(1, 'rgba(0,0,0,0)');
        ctx3d.fillStyle = halo;
        ctx3d.beginPath();
        ctx3d.arc(p.sx, p.sy, radius * 2.7 * pulse, 0, Math.PI * 2);
        ctx3d.fill();
      }

      const g = ctx3d.createRadialGradient(p.sx - radius * 0.32, p.sy - radius * 0.32, radius * 0.1, p.sx, p.sy, radius);
      g.addColorStop(0, '#ffffff');
      g.addColorStop(0.38, nodeColor);
      g.addColorStop(1, '#0b1222');
      ctx3d.fillStyle = g;
      ctx3d.beginPath();
      ctx3d.arc(p.sx, p.sy, radius, 0, Math.PI * 2);
      ctx3d.fill();

      if (show.labels && related) {
        const text = hideNames ? '？' : n3.short;
        const fontSize = Math.max(10, Math.min(13, 11.5 * p.scale));
        ctx3d.font = `${isFocal ? '700' : '600'} ${fontSize}px ${FONT_3D}`;
        ctx3d.textAlign = 'center';
        const ly = p.sy - radius - 6;
        const tw = ctx3d.measureText(text).width;
        ctx3d.fillStyle = 'rgba(8, 13, 26, 0.72)';
        ctx3d.beginPath();
        ctx3d.roundRect(p.sx - tw / 2 - 5, ly - fontSize + 1, tw + 10, fontSize + 5, 4);
        ctx3d.fill();
        ctx3d.fillStyle = isFocal ? '#ffffff' : '#e2e8f0';
        ctx3d.fillText(text, p.sx, ly);
      }
      ctx3d.globalAlpha = 1;
    }});
  });

  // 画家算法：由远及近
  drawList.sort((a, b) => a.z - b.z);
  for (const item of drawList) item.draw();

  // 只在 3D 视图可见时持续绘制
  rafId = state.view === '3d' ? requestAnimationFrame(render) : null;
}

function hitTestNode(e) {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  let best = null;
  for (const pn of projectedNodes) {
    if (Math.hypot(mx - pn.sx, my - pn.sy) <= pn.r + 5 && (!best || pn.z > best.z)) best = pn;
  }
  return best ? best.id : null;
}

function setHover3D(id) {
  if (state.quizMode) id = null;
  viewport3d.style.cursor = id ? 'pointer' : '';
  if (id === state.hoverId) return;
  state.hoverId = id;
  applyAllHighlights();
}

canvas.addEventListener('pointerdown', e => {
  dragging = true;
  dragMoved = false;
  lastX = e.clientX;
  lastY = e.clientY;
  canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener('pointermove', e => {
  if (!dragging) { setHover3D(hitTestNode(e)); return; }
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  if (Math.hypot(dx, dy) > 2) dragMoved = true;
  cam.targetYaw += dx * 0.0085;
  cam.targetPitch = Math.max(-1.42, Math.min(1.42, cam.targetPitch + dy * 0.0085));
  lastX = e.clientX;
  lastY = e.clientY;
  if (dragMoved) setCamPreset(null);
});

canvas.addEventListener('pointerup', e => {
  dragging = false;
  if (dragMoved) return;
  const id = hitTestNode(e);
  if (state.quizMode) { if (id) handleQuizAnswer(id); return; }
  const next = id && state.selectedId !== id ? id : null;
  clearFocus();
  state.selectedId = next;
  updateUI();
});
canvas.addEventListener('pointercancel', () => { dragging = false; });
canvas.addEventListener('pointerleave', () => { if (!dragging) setHover3D(null); });

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  cam.targetZoom = Math.max(0.58, Math.min(1.9, cam.targetZoom - e.deltaY * 0.001));
}, { passive: false });

function setCamPreset(name) {
  if (name) {
    const v = PRESET_VIEWS[name];
    cam.targetYaw = v.yaw; cam.targetPitch = v.pitch; cam.targetZoom = v.zoom;
    state.show3d.auto = false;
  }
  document.querySelectorAll('#camPresets .hud-pill').forEach(b => b.classList.toggle('active', b.dataset.cam === name));
  syncViewUI();
}
function resetCamera() { setCamPreset('front'); }

function setView(view) {
  state.view = view;
  state.hoverId = null;
  updateUI();
  if (view === '3d') {
    resizeCanvas();
    if (rafId === null) rafId = requestAnimationFrame(render);
  }
}

function syncViewUI() {
  svgWrap.classList.toggle('is-hidden', state.view !== '2d');
  viewport3d.classList.toggle('is-hidden', state.view !== '3d');
  document.querySelectorAll('#viewTabs .seg-btn').forEach(b => b.classList.toggle('active', b.dataset.view === state.view));
  document.querySelectorAll('#sceneToggles .hud-pill').forEach(b => b.classList.toggle('active', state.show3d[b.dataset.toggle]));
}

document.querySelectorAll('#viewTabs .seg-btn').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));
document.querySelectorAll('#camPresets .hud-pill').forEach(b => b.addEventListener('click', () => setCamPreset(b.dataset.cam)));
document.querySelectorAll('#sceneToggles .hud-pill').forEach(b => b.addEventListener('click', () => {
  state.show3d[b.dataset.toggle] = !state.show3d[b.dataset.toggle];
  syncViewUI();
}));

// Event bindings
const LESION_KEYS = [...document.querySelectorAll('.pill[data-lesion]')].map(b => b.dataset.lesion);

document.querySelectorAll('.pill[data-lesion]').forEach(btn => {
  btn.addEventListener('click', () => setLesion(state.lesionKey === btn.dataset.lesion ? null : btn.dataset.lesion));
});

document.getElementById('levelBar').addEventListener('click', e => {
  const b = e.target.closest('[data-level]');
  if (b) setLesion(state.lesionKey, b.dataset.level);
});

document.querySelectorAll('#limbModeTabs .seg-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    if (state.quizMode && !state.quizAnswered && currentQuiz().zones) return;
    setLimbMode(btn.dataset.mode);
  });
});

function togglePulse() { state.pulse = !state.pulse; updateUI(); }
function toggleCollaterals() { state.showCollaterals = !state.showCollaterals; renderPlexusSVG(); updateUI(); }
function toggleQuiz() {
  const on = !state.quizMode;
  clearFocus();
  state.quizPicks = new Set();
  state.quizMode = on;
  if (on) { state.showCollaterals = true; loadQuizQuestion(); }
  else { renderPlexusSVG(); updateUI(); }
}
function nextQuiz() { if (state.quizMode) { state.quizIdx++; loadQuizQuestion(); } }
function revealQuiz() {
  if (!state.quizMode || state.quizAnswered) return;
  const item = currentQuiz();
  if (item.zones) { submitZoneQuiz(true); return; }
  state.quizAnswered = true;
  state.selectedId = item.target;
  setQuizFeedback(`💡 答案是「${nodeMap[item.target].label}」。`);
  renderPlexusSVG();
  updateUI();
}
function setTheme(dark) {
  state.dark = dark;
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  document.getElementById('btnTheme').textContent = dark ? '☀️ 浅色' : '🌙 深色';
}
// 投影模式：放大字号，图撑满窗口高度
function setPresent(on) {
  state.present = on;
  document.body.classList.toggle('present', on);
}
function resetAll() {
  clearFocus();
  state.quizMode = false;
  state.quizPicks = new Set();
  state.show3d = { artery: true, bones: true, labels: true, auto: false };
  resetCamera();
  renderPlexusSVG();
  updateUI();
}

document.getElementById('btnPulse').addEventListener('click', togglePulse);
document.getElementById('btnCollaterals').addEventListener('click', toggleCollaterals);
document.getElementById('btnQuiz').addEventListener('click', toggleQuiz);
document.getElementById('btnNextQuiz').addEventListener('click', nextQuiz);
document.getElementById('btnRevealQuiz').addEventListener('click', revealQuiz);
document.getElementById('btnSubmitQuiz').addEventListener('click', () => submitZoneQuiz(false));
document.getElementById('btnReset').addEventListener('click', resetAll);
document.getElementById('btnTheme').addEventListener('click', () => { setTheme(!state.dark); updateUI(); });
document.getElementById('btnPresent').addEventListener('click', () => { setPresent(!state.present); updateUI(); });
document.getElementById('btnPrint').addEventListener('click', () => window.print());

// ---- 键盘快捷键 ----
// 数字键 = 损伤预设，←/→ = 损伤部位，空格 = 冲动动画；投影模式下 ↑/↓ 与翻页键（翻页笔）逐个切换预设
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.closest && e.target.closest('input, textarea, select')) return;
  const k = e.key, lower = k.toLowerCase();
  const pager = state.present && !state.quizMode;
  let handled = true;

  if (k === ' ') togglePulse();
  else if (lower === 'p') { setPresent(!state.present); updateUI(); }
  else if (lower === 'q') toggleQuiz();
  else if (lower === 'v') setView(state.view === '2d' ? '3d' : '2d');
  else if (state.quizMode) {
    if (lower === 'n' || k === 'ArrowRight' || k === 'PageDown') nextQuiz();
    else if (k === 'Enter' && currentQuiz().zones) submitZoneQuiz(false);
    else handled = false;
  }
  else if (k >= '1' && k <= '9' && LESION_KEYS[+k - 1]) setLesion(state.lesionKey === LESION_KEYS[+k - 1] ? null : LESION_KEYS[+k - 1]);
  else if (k === '0' || k === 'Escape') { clearFocus(); updateUI(); }
  else if ((k === 'ArrowRight' || k === 'ArrowLeft') && state.lesionKey) stepLevel(k === 'ArrowRight' ? 1 : -1);
  else if (pager && (k === 'ArrowDown' || k === 'PageDown')) stepLesion(1);
  else if (pager && (k === 'ArrowUp' || k === 'PageUp')) stepLesion(-1);
  else if (lower === 'm') { const modes = ['motor', 'cutaneous', 'dermatome']; setLimbMode(modes[(modes.indexOf(state.limbMode) + 1) % 3]); }
  else if (lower === 'c') toggleCollaterals();
  else handled = false;

  if (handled) {
    e.preventDefault();
    // 空格/回车会再次触发刚点过的按钮，先让它失焦
    if (document.activeElement && document.activeElement.tagName === 'BUTTON') document.activeElement.blur();
  }
});

// ---- 用网址记住状态 ----
// 例：brachial_plexus.html#lesion=erb&level=root　或　#node=radial&view=3d　或　#lesion=median&limb=cutaneous&present=1
function writeHash() {
  if (state.quizMode) return;
  const p = new URLSearchParams();
  if (state.lesionKey) {
    p.set('lesion', state.lesionKey);
    if (currentLevel() !== PlexusModel.LESION_SITES[state.lesionKey].def) p.set('level', currentLevel());
  } else if (state.selectedZoneId) p.set('zone', state.selectedZoneId);
  else if (state.selectedId) p.set('node', state.selectedId);
  if (state.limbMode !== 'motor' && !state.selectedZoneId) p.set('limb', state.limbMode);
  if (state.view === '3d') p.set('view', '3d');
  if (state.present) p.set('present', '1');
  if (state.dark) p.set('theme', 'dark');
  const h = p.toString();
  if ((location.hash || '#') === '#' + h) return;
  try {
    history.replaceState(null, '', h ? '#' + h : location.pathname + location.search);
  } catch (err) {
    // 某些预览环境不允许改地址，忽略即可
  }
}

function applyHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  const own = (o, key) => key != null && Object.prototype.hasOwnProperty.call(o, key);
  state.quizMode = false;
  state.quizPicks = new Set();
  clearFocus();

  const limb = p.get('limb');
  if (own(LIMB_ZONES, limb)) state.limbMode = limb;

  const lesion = p.get('lesion'), zone = p.get('zone'), node = p.get('node');
  if (own(PlexusModel.LESION_SITES, lesion)) {
    state.lesionKey = lesion;
    const level = p.get('level');
    state.lesionLevel = PlexusModel.LESION_SITES[lesion].levels.some(l => l.key === level) ? level : null;
  } else if (zone && PlexusModel.target(zone)) {
    const t = PlexusModel.target(zone);
    state.selectedZoneId = zone;
    state.selectedId = t.fibers[0].nerve;
    state.limbMode = t.kind;
  } else if (own(nodeMap, node)) {
    state.selectedId = node;
  }
  if (state.lesionKey === 'long_thoracic' || (state.selectedId && nodeMap[state.selectedId].stage === 'collateral')) state.showCollaterals = true;

  setTheme(p.get('theme') === 'dark');
  setPresent(p.get('present') === '1');
  renderPlexusSVG();
  renderLimbSVG();
  setView(p.get('view') === '3d' ? '3d' : '2d');
}

window.addEventListener('hashchange', applyHash);
applyHash();
</script>
</body>
</html>
