<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>臂丛神经联动可视化 | Brachial Plexus Atlas</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/extra.css">
<link rel="stylesheet" href="css/limb3d.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-badge">BP</div>
      <div>
        <h1>臂丛神经图谱</h1>
      </div>
    </div>
    <div class="search" id="search">
      <input id="searchInput" type="search" autocomplete="off" spellcheck="false"
        placeholder="搜索神经、肌肉、体征   /" aria-label="搜索">
      <div class="search-results is-hidden" id="searchResults" role="listbox"></div>
    </div>
    <div class="toolbar">
      <button class="btn btn-mode" id="btnQuiz" title="自测 · Q">自测</button>
      <span class="tool-sep" aria-hidden="true"></span>
      <button class="btn" id="btnReset" title="回到初始状态">重置</button>
      <div class="menu" id="toolMenu">
        <button class="btn" id="btnTools" aria-haspopup="true" aria-expanded="false" title="投影、打印、主题">工具 ▾</button>
        <div class="menu-list is-hidden" id="toolList" role="menu">
          <button class="menu-item" id="btnPresent" role="menuitemcheckbox" title="↑↓ 或翻页笔切换损伤预设">
            <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="10" rx="1.5"/><path d="M10 13.5v3M6.5 16.5h7"/></svg>
            <span>投影模式</span><kbd>P</kbd>
          </button>
          <button class="menu-item" id="btnPrint" role="menuitem">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6 7V3h8v4M6 14H4a1.5 1.5 0 0 1-1.5-1.5v-4A1.5 1.5 0 0 1 4 7h12a1.5 1.5 0 0 1 1.5 1.5v4A1.5 1.5 0 0 1 16 14h-2"/><rect x="6" y="11" width="8" height="6"/></svg>
            <span>打印讲义</span>
          </button>
          <button class="menu-item" id="btnTheme" role="menuitem">
            <svg class="ico-moon" viewBox="0 0 20 20" aria-hidden="true"><path d="M16.5 11.5A7 7 0 0 1 8.5 3.5a6.5 6.5 0 1 0 8 8z"/></svg>
            <svg class="ico-sun" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.4"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4"/></svg>
            <span id="themeLabel">深色主题</span>
          </button>
          <footer class="credits">
            仅供学习 · 3D 神经走行 <a href="https://github.com/Z-Anatomy/Models-of-human-anatomy" target="_blank" rel="noopener">Z-Anatomy</a>（CC BY-SA 4.0）· 骨骼与肌肉网格 <a href="https://dbarchive.biosciencedbc.jp/en/bodyparts3d/download.html" target="_blank" rel="noopener">BodyParts3D</a> © DBCLS（CC BY 4.0）· <a href="CREDITS.md" target="_blank">许可</a>
          </footer>
        </div>
      </div>
    </div>
  </header>

  <!-- 自测条：题目、选项、反馈和操作都在作答区正上方 -->
  <section class="quiz-box" id="quizBox" aria-label="自测">
    <div class="quiz-side">
      <div class="quiz-meta">
        <span>自测</span>
        <span id="quizScore">0 / 0</span>
        <span class="quiz-stats" id="quizStats"></span>
      </div>
      <div class="seg-group" id="quizDeckTabs">
        <button class="seg-btn active" data-deck="all">全部</button>
        <button class="seg-btn" data-deck="locate">定位</button>
        <button class="seg-btn" data-deck="case">病例</button>
        <button class="seg-btn" data-deck="mcq">选择题</button>
        <button class="seg-btn" data-deck="wrong">错题</button>
      </div>
    </div>
    <div class="quiz-main">
      <div class="quiz-q" id="quizQuestion"></div>
      <div class="quiz-where" id="quizWhere"></div>
      <div class="quiz-options" id="quizOptions"></div>
      <div class="quiz-feedback" id="quizFeedback" aria-live="polite"></div>
    </div>
    <div class="quiz-actions">
      <button class="btn active is-hidden" id="btnSubmitQuiz" title="回车">提交</button>
      <button class="btn" id="btnNextQuiz" title="N 或 →">下一题</button>
      <button class="btn" id="btnRevealQuiz">看答案</button>
      <button class="btn btn-quiet" id="btnClearProgress" title="清除本机做题记录">清空记录</button>
      <button class="btn btn-quiet" id="btnExitQuiz" title="退出自测，回到之前浏览的内容 · Esc">退出</button>
    </div>
  </section>

  <main class="workbench" id="workbench">
    <!-- 主舞台：臂丛通路图 / 3D -->
    <section class="stage">
      <div class="stage-bar">
        <div class="seg-group seg-solid" id="viewTabs">
          <button class="seg-btn active" data-view="2d" title="追踪连接关系：谁发出谁、纤维怎么走 · V">2D 通路图</button>
          <button class="seg-btn" data-view="3d" title="看位置与毗邻：前后、内外、与骨和动脉的关系 · V">3D 解剖</button>
        </div>
        <div class="lesion-bar">
          <span class="lesion-label">损伤模拟</span>
          <button class="pill" data-lesion="erb" title="上臂丛损伤（C5–C6）· Erb 麻痹、侍者小费手 · 1；← → 换部位">上臂丛</button>
          <button class="pill" data-lesion="klumpke" title="下臂丛损伤（C8–T1）· Klumpke 麻痹 · 2">下臂丛</button>
          <button class="pill" data-lesion="radial" title="桡神经损伤 · 垂腕或垂指，视部位而定 · 3">桡神经</button>
          <button class="pill" data-lesion="median" title="正中神经损伤 · 猿手、祝福手、OK 征异常，视部位而定 · 4">正中神经</button>
          <button class="pill" data-lesion="ulnar" title="尺神经损伤 · 爪形手 · 5">尺神经</button>
          <button class="pill" data-lesion="axillary" title="腋神经损伤 · 方肩 · 6">腋神经</button>
          <button class="pill" data-lesion="long_thoracic" title="胸长神经损伤 · 翼状肩胛 · 7">胸长神经</button>
          <span class="tool-sep" aria-hidden="true"></span>
          <button class="pill pill-cut" id="btnCut" title="手动切断：点通路图上任意结构，可切多处 · X">✂ 手动切断</button>
        </div>
        <div class="level-bar is-hidden" id="levelBar"></div>
        <div class="cut-bar is-hidden" id="cutBar"></div>
      </div>

      <div class="svg-wrap pulse-on" id="svgWrap">
        <svg id="plexus" viewBox="0 0 1060 620" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>

      <div class="viewport3d is-hidden" id="viewport3d">
        <canvas id="scene"></canvas>
        <div class="labels3d" id="labels3d"></div>
        <div class="hud-top">
          <div class="hud-group" id="camPresets">
            <button class="hud-pill hud-focus" id="btnFocus3d" title="把镜头对准当前选中或受损的结构 · F" disabled>聚焦当前</button>
            <span class="hud-sep" aria-hidden="true"></span>
            <button class="hud-pill active" data-cam="front" title="恢复总览（前面观）">总览</button>
            <button class="hud-pill" data-cam="top" title="看前后束">俯视</button>
            <button class="hud-pill" data-cam="lateral">外侧</button>
            <button class="hud-pill" data-cam="back">后面</button>
            <button class="hud-pill" data-cam="arm">全臂</button>
          </div>
          <div class="hud-group" id="sceneToggles">
            <button class="hud-pill" data-toggle="artery">动脉</button>
            <button class="hud-pill" data-toggle="bones">骨骼</button>
            <button class="hud-pill" data-toggle="muscles">肌肉</button>
            <button class="hud-pill" data-toggle="labels">标签</button>
            <button class="hud-pill" data-toggle="auto">旋转</button>
          </div>
        </div>
        <div class="hud-bottom" id="hud3dCaption">真实走行（束段为补画）· 拖动旋转 · 滚轮缩放 · 右键平移</div>
        <div class="hud-fallback is-hidden" id="hud3dFallback">此浏览器无法创建 WebGL，3D 视图不可用。</div>
      </div>

      <div class="stage-foot">
        <div class="canvas-tools" role="group" aria-label="画布显示">
          <button class="chip-btn active" id="btnPulse" title="冲动传导动画 · 空格">冲动</button>
          <button class="chip-btn active" id="btnCollaterals" title="显示旁支 · C">旁支</button>
        </div>
        <div class="legend">
          <span class="legend-item"><span class="swatch" style="background:var(--ant-color)"></span>前股·屈肌</span>
          <span class="legend-item"><span class="swatch" style="background:var(--post-color)"></span>后股·伸肌</span>
          <span class="legend-item"><span class="swatch" style="background:var(--accent)"></span>选中通路</span>
          <span class="legend-item"><span class="swatch" style="background:var(--lesion-color)"></span>受累</span>
          <span class="legend-item"><span class="swatch dashed"></span>部分</span>
          <span class="legend-item"><span class="swatch dotted"></span>保留</span>
        </div>
      </div>
    </section>

    <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" tabindex="0"
      title="拖动调整两侧宽度 · 双击恢复默认" aria-label="调整上肢图宽度"></div>

    <!-- 侧窗格：上肢联动图 -->
    <section class="limb-pane">
      <div class="limb-header">
        <span class="limb-title">右上肢</span>
        <div class="seg-group" id="limbModeTabs" title="快捷键 M">
          <button class="seg-btn active" data-mode="motor">肌肉</button>
          <button class="seg-btn" data-mode="cutaneous">皮区</button>
          <button class="seg-btn" data-mode="dermatome">皮节</button>
        </div>
      </div>

      <div class="limb-svg-box">
        <svg id="limbSvg" viewBox="0 0 440 420" xmlns="http://www.w3.org/2000/svg"></svg>
        <!-- 「肌肉」页：BodyParts3D 真实网格，背阔肌取自 Z-Anatomy（js/limb3d.js）；加载失败或无 WebGL 时仍用上面的示意图 -->
        <div class="limb3d is-hidden" id="limb3d"></div>
        <div class="l3-extra is-hidden" id="limb3dExtra"></div>
      </div>

      <div class="limb-status">
        <span id="limbCaption"></span>
      </div>
      <!-- 当前状态摘要：与图在同一处读到「受累 / 部分 / 保留 / 原因」 -->
      <div class="limb-summary" id="limbSummary"></div>
    </section>
  </main>

  <!-- 底部停靠栏：自测 + 结构详情 -->
  <aside class="dock" id="dock">
    <div class="dock-strip">
      <strong id="dockStripTitle"></strong>
      <span id="dockStripSub"></span>
      <button class="btn btn-quiet" id="btnDock" aria-expanded="true" aria-controls="detailContent">收起详情</button>
    </div>
    <div id="detailContent">
      <div class="info-block dock-head">
        <div class="tag-row" id="dTags"></div>
        <h2 id="dTitle">臂丛神经</h2>
        <div class="en-name" id="dSub">Brachial Plexus</div>
        <p class="seg-note" id="dSegments"></p>
        <section class="info-sec">
          <h3>位置</h3>
          <p id="dSpatial"></p>
        </section>
      </div>

      <div class="info-block dock-func">
        <section class="info-sec">
          <h3>运动</h3>
          <p id="dMotor"></p>
        </section>
        <section class="info-sec">
          <h3>感觉</h3>
          <p id="dSensory"></p>
        </section>
      </div>

      <div class="info-block dock-clin">
        <section class="info-sec">
          <h3>临床</h3>
          <p id="dClinical"></p>
        </section>
      </div>

      <div class="info-block clinical-card is-hidden" id="dCard">
        <h3>查体</h3>
        <dl id="dCardBody"></dl>
      </div>
    </div>

  </aside>

<script type="module" src="js/main.js"></script>
</body>
</html>
