<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>臂丛神经联动可视化 | Brachial Plexus Atlas</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/extra.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-badge">BP</div>
      <div>
        <h1>臂丛神经图谱</h1>
      </div>
    </div>
    <div class="search" id="search">
      <input id="searchInput" type="search" autocomplete="off" spellcheck="false"
        placeholder="搜索神经、肌肉、体征   /" aria-label="搜索">
      <div class="search-results is-hidden" id="searchResults" role="listbox"></div>
    </div>
    <div class="toolbar">
      <button class="btn active" id="btnPulse" title="冲动传导动画 · 空格">冲动</button>
      <button class="btn active" id="btnCollaterals" title="显示旁支 · C">旁支</button>
      <button class="btn" id="btnCut" title="自由切断 · X">切断</button>
      <button class="btn" id="btnQuiz" title="自测 · Q">自测</button>
      <button class="btn" id="btnPresent" title="投影 · P；↑↓ 或翻页笔切换预设">投影</button>
      <button class="btn" id="btnPrint">打印</button>
      <button class="btn" id="btnReset">重置</button>
      <button class="btn" id="btnTheme">深色</button>
    </div>
  </header>

  <main class="workbench">
    <!-- 主舞台：臂丛通路图 / 3D -->
    <section class="stage">
      <div class="stage-bar">
        <div class="seg-group" id="viewTabs" title="快捷键 V">
          <button class="seg-btn active" data-view="2d">2D 通路图</button>
          <button class="seg-btn" data-view="3d">3D 解剖示意</button>
        </div>
        <div class="lesion-bar">
          <span class="lesion-label">损伤</span>
          <button class="pill" data-lesion="erb" title="Erb 麻痹 · 上臂丛 · 1；← → 换部位">Erb</button>
          <button class="pill" data-lesion="klumpke" title="Klumpke 麻痹 · 下臂丛 · 2">Klumpke</button>
          <button class="pill" data-lesion="radial" title="桡神经 · 3">垂腕</button>
          <button class="pill" data-lesion="median" title="正中神经 · 4">猿手</button>
          <button class="pill" data-lesion="ulnar" title="尺神经 · 5">爪形手</button>
          <button class="pill" data-lesion="axillary" title="腋神经 · 6">方肩</button>
          <button class="pill" data-lesion="long_thoracic" title="胸长神经 · 7">翼状肩胛</button>
        </div>
        <div class="level-bar is-hidden" id="levelBar"></div>
        <div class="cut-bar is-hidden" id="cutBar"></div>
      </div>

      <div class="svg-wrap pulse-on" id="svgWrap">
        <svg id="plexus" viewBox="0 0 1060 620" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>

      <div class="viewport3d is-hidden" id="viewport3d">
        <canvas id="scene"></canvas>
        <div class="labels3d" id="labels3d"></div>
        <div class="hud-top">
          <div class="hud-group" id="camPresets">
            <button class="hud-pill active" data-cam="front">前面</button>
            <button class="hud-pill" data-cam="top" title="看前后束">俯视</button>
            <button class="hud-pill" data-cam="lateral">外侧</button>
            <button class="hud-pill" data-cam="back">后面</button>
            <button class="hud-pill" data-cam="arm">全臂</button>
          </div>
          <div class="hud-group" id="sceneToggles">
            <button class="hud-pill" data-toggle="artery">动脉</button>
            <button class="hud-pill" data-toggle="bones">骨骼</button>
            <button class="hud-pill" data-toggle="muscles">肌肉</button>
            <button class="hud-pill" data-toggle="labels">标签</button>
            <button class="hud-pill" data-toggle="auto">旋转</button>
          </div>
        </div>
        <div class="hud-bottom" id="hud3dCaption">示意模型 · 拖动旋转 · 滚轮缩放 · 右键平移</div>
        <div class="hud-fallback is-hidden" id="hud3dFallback">此浏览器无法创建 WebGL，3D 视图不可用。</div>
      </div>

      <div class="legend">
        <span class="legend-item"><span class="dot" style="background:var(--root-color)"></span>根</span>
        <span class="legend-item"><span class="dot" style="background:var(--trunk-color)"></span>干</span>
        <span class="legend-item"><span class="dot" style="background:var(--ant-color)"></span>前股·屈肌</span>
        <span class="legend-item"><span class="dot" style="background:var(--post-color)"></span>后股·伸肌</span>
        <span class="legend-item"><span class="dot" style="background:var(--cord-color)"></span>束</span>
        <span class="legend-item"><span class="dot" style="background:var(--branch-color)"></span>终末支</span>
        <span class="legend-item"><span class="dot" style="background:var(--lesion-color)"></span>受累</span>
        <span class="legend-item"><span class="dot" style="background:var(--lesion-color);opacity:0.4"></span>部分</span>
      </div>
    </section>

    <!-- 侧窗格：上肢联动图 -->
    <section class="limb-pane">
      <div class="limb-header">
        <span class="limb-title">右上肢</span>
        <div class="seg-group" id="limbModeTabs" title="快捷键 M">
          <button class="seg-btn active" data-mode="motor">肌肉</button>
          <button class="seg-btn" data-mode="cutaneous">皮区</button>
          <button class="seg-btn" data-mode="dermatome">皮节</button>
        </div>
      </div>

      <div class="limb-svg-box">
        <svg id="limbSvg" viewBox="0 0 440 420" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>

      <div class="limb-status">
        <span id="limbCaption"></span>
      </div>
      <div class="chip-list" id="activeChips"></div>
      <footer class="credits">
        仅供学习 · 3D 改编自 <a href="https://github.com/prathusa/anatomy" target="_blank" rel="noopener">prathusa/anatomy</a>（CC BY 4.0）· <a href="CREDITS.md" target="_blank">许可</a>
      </footer>
    </section>
  </main>

  <!-- 底部停靠栏：自测 + 结构详情 -->
  <aside class="dock">
    <div class="quiz-box" id="quizBox">
      <div class="quiz-meta">
        <span>自测</span>
        <span id="quizScore">0 / 0</span>
      </div>
      <div class="quiz-deck">
        <div class="seg-group" id="quizDeckTabs">
          <button class="seg-btn active" data-deck="all">全部</button>
          <button class="seg-btn" data-deck="locate">定位</button>
          <button class="seg-btn" data-deck="case">病例</button>
          <button class="seg-btn" data-deck="mcq">选择题</button>
          <button class="seg-btn" data-deck="wrong">错题</button>
        </div>
        <span class="quiz-stats" id="quizStats"></span>
      </div>
      <div class="quiz-q" id="quizQuestion"></div>
      <div class="quiz-options" id="quizOptions"></div>
      <div class="quiz-feedback" id="quizFeedback"></div>
      <div class="quiz-actions">
        <button class="btn active is-hidden" id="btnSubmitQuiz">提交</button>
        <button class="btn" id="btnNextQuiz">下一题</button>
        <button class="btn" id="btnRevealQuiz">答案</button>
        <button class="btn btn-quiet" id="btnClearProgress" title="清除本机做题记录">清空</button>
      </div>
    </div>

    <div id="detailContent">
      <div class="info-block dock-head">
        <div class="tag-row" id="dTags"></div>
        <h2 id="dTitle">臂丛神经</h2>
        <div class="en-name" id="dSub">Brachial Plexus</div>
        <p id="dSegments"></p>
      </div>

      <div class="info-block">
        <h3>位置</h3>
        <p id="dSpatial"></p>
      </div>

      <div class="info-block">
        <h3>运动</h3>
        <p id="dMotor"></p>
      </div>

      <div class="info-block">
        <h3>感觉</h3>
        <p id="dSensory"></p>
      </div>

      <div class="info-block">
        <h3>临床</h3>
        <p id="dClinical"></p>
      </div>

      <div class="info-block clinical-card is-hidden" id="dCard">
        <h3>查体</h3>
        <dl id="dCardBody"></dl>
      </div>
    </div>

  </aside>

<script type="module" src="js/main.js"></script>
</body>
</html>
